              - {op: driver_store_restore, icon: download}
              - {op: driver_store_open_backups, icon: folder-open}

      - id: audit
        title: "AUDIT"
        title_ru: "АУДИТ"
        about: "A report of the drivers and firmware of this machine"
        about_ru: "Отчёт о драйверах и прошивках этой машины"
        icon: clipboard-check
