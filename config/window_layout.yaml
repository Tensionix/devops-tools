# Where every operation stands in the window on Avalonia.
#
# config\tool_manifest.yaml says what an operation is: its service, its fields, its texts. This
# file says where it stands: a section (a large button under the header), a page of the section
# (the row under the sections), a card of the page. The console command hands it to the window with
# `describe`; how it is read - system_core\core\window_layout.py.
#
#   cards:   `op` - an operation with its form; `guests` - operations whose buttons stand in the
#            same card and read the same fields;
#            `switch` - a row of operations, each bringing the machine into one state (`is`); the one
#            the machine is in now is lit (`state` names what is read: system_core\services\machine_state.py);
#            `pick` - a row choosing the operation the one run button of the card starts
#   block:   the frame a card stands in, with its neighbours of the same name
#   tone:    "run" - the main action of its block, a filled button; "burn" - it removes
#   form:    "none" - the operation runs on its defaults, its fields are not drawn
#   state:   true - the page has switches: the window asks `devops_cli.cmd state --page <id>`
#   shared:  the fields whose value is one for the whole window - what a person picks about the
#            machine once; every other field belongs to its page
#   about:   the line under a section, and the second line of the tooltip of a page. Every section
#            has its line and at least two pages - the owner, 15.10.2026
#
# An operation of the manifest that stands nowhere here must be named in `folders`, `pending` or
# `retired` - tests\test_window_layout.py checks it.

sections:
  - id: network
    title: "NETWORK"
    title_ru: "СЕТЬ"
    about: "Internet link, Wi-Fi, DNS, repair, hosts"
    about_ru: "Выход в интернет, Wi-Fi, DNS, ремонт, hosts"
    icon: network
    pages:
      - id: link
        title: "LINK"
        title_ru: "ПОДКЛЮЧЕНИЕ"
        about: "Which way the internet goes: the cable or one of two Wi-Fi networks; adapters and Windows sharing"
        about_ru: "Каким путём идёт интернет: провод или одна из двух сетей Wi-Fi; адаптеры и общий доступ Windows"
        icon: cable
        state: true
        # The Wi-Fi adapter is chosen on the page WI-FI: its value is one for the whole window.
        away: [wifi_adapter]
        cards:
          - switch: internet
            block: "Internet"
            block_ru: "Выход в интернет"
            icon: router
            options:
              - {op: internet_via_cable, is: cable, title: "CABLE", title_ru: "ПРОВОД", icon: cable}
              - {op: wifi_slot_connect_main, is: main, title: "WI-FI MAIN", title_ru: "WI-FI MAIN", icon: wifi}
              - {op: wifi_slot_connect_second, is: second, title: "WI-FI SECOND", title_ru: "WI-FI SECOND", icon: wifi}
            guests:
              - {op: wifi_slot_status, icon: scan-search}
          - op: wifi_slot_save_main
            block: "Wi-Fi slots"
            block_ru: "Слоты Wi-Fi"
            title: "WI-FI MAIN"
            title_ru: "WI-FI MAIN"
            icon: save
            tone: run
            guests:
              - {op: wifi_slot_forget_main, icon: trash-2, tone: burn}
          - op: wifi_slot_save_second
            block: "Wi-Fi slots"
            block_ru: "Слоты Wi-Fi"
            title: "WI-FI SECOND"
            title_ru: "WI-FI SECOND"
            icon: save
            tone: run
            guests:
              - {op: wifi_slot_forget_second, icon: trash-2, tone: burn}
          - {op: network_lan_wifi_switch, block: "LAN / Wi-Fi", block_ru: "LAN / Wi-Fi", icon: arrow-left-right, tone: run}
          - {op: network_wifi_sticky_pair, block: "LAN / Wi-Fi", block_ru: "LAN / Wi-Fi", icon: link}
          - {op: network_adapter_apply, block: "Adapter", block_ru: "Адаптер", icon: plug, tone: run}
          - {op: smb_network_login, block: "Windows sharing", block_ru: "Общий доступ Windows", icon: folder-symlink, tone: run}

      - id: wifi
        title: "WI-FI"
        title_ru: "WI-FI"
        about: "Wi-Fi profiles: status, connection, hotspot, export and import"
        about_ru: "Профили Wi-Fi: статус, подключение, раздача, экспорт и импорт"
        icon: wifi
        cards:
          - op: network_wifi_status
            block: "Status and connection"
            block_ru: "Статус и подключение"
            icon: scan-search
            guests:
              - {op: network_wifi_connect, icon: plug-zap, tone: run}
          - {op: network_wifi_connection_mode, block: "Status and connection", block_ru: "Статус и подключение", icon: settings-2}
          - {op: network_wifi_hotspot, block: "Hotspot", block_ru: "Раздача", icon: radio-tower, tone: run}
          - {op: network_wifi_export, block: "Export / import", block_ru: "Экспорт / импорт", icon: upload, tone: run}
          - pick: wifi_import
            block: "Export / import"
            block_ru: "Экспорт / импорт"
            icon: download
            tone: run
            options:
              - {op: network_wifi_import_file, title: "FROM A FILE", title_ru: "ИЗ ФАЙЛА", icon: file}
              - {op: network_wifi_import_folder, title: "FROM A FOLDER", title_ru: "ИЗ ПАПКИ", icon: folder}

      - id: dns
        title: "DNS"
        title_ru: "DNS"
        about: "Who resolves names on this machine and who says there is internet"
        about_ru: "Кто разрешает имена на этой машине и кто говорит, что интернет есть"
        icon: globe
        state: true
        cards:
          - {op: dns_status, block: "Snapshot", block_ru: "Снимок", icon: scan-search}
          - switch: resolver
            block: "Resolver"
            block_ru: "Резолвер"
            icon: server
            options:
              - {op: dns_use_auto, is: auto, title: "FROM THE ROUTER (DHCP)", title_ru: "ОТ РОУТЕРА (DHCP)", icon: router}
              - {op: dns_use_router, is: router, title: "ROUTER", title_ru: "РОУТЕР", icon: router}
              - {op: dns_use_cloudflare, is: cloudflare, title: "CLOUDFLARE", title_ru: "CLOUDFLARE", icon: cloud}
              - {op: dns_use_google, is: google, title: "GOOGLE", title_ru: "GOOGLE", icon: globe}
              - {op: dns_use_quad9, is: quad9, title: "QUAD9", title_ru: "QUAD9", icon: shield}
              - {op: dns_use_yandex, is: yandex, title: "YANDEX", title_ru: "ЯНДЕКС", icon: globe}
              - {op: dns_use_adguard, is: adguard, title: "ADGUARD", title_ru: "ADGUARD", icon: shield-check}
          - op: dns_repair
            block: "Repair"
            block_ru: "Починка"
            icon: wrench
            tone: run
            guests:
              - {op: dns_fix_icon, icon: wifi}

      - id: repair
        title: "REPAIR"
        title_ru: "РЕМОНТ"
        about: "A snapshot and a backup of the network, its restore, three strengths of repair, the proxy"
        about_ru: "Снимок и копия сети, восстановление, три силы ремонта, прокси"
        icon: wrench
        cards:
          - {op: network_status, block: "Snapshot", block_ru: "Снимок", icon: scan-search}
          - op: network_backup
            block: "Backup"
            block_ru: "Резервная копия"
            icon: archive
            tone: run
            guests:
              - {op: network_backup_wifi_keys, icon: key-round}
              - {op: network_open_backup, icon: folder-open}
          - pick: network_restore
            block: "Restore"
            block_ru: "Восстановление"
            icon: rotate-ccw
            tone: run
            options:
              - {op: network_restore_latest, title: "THE LATEST", title_ru: "ПОСЛЕДНИЙ", icon: history}
              - {op: network_restore_selected, title: "THE ONE CHOSEN", title_ru: "ВЫБРАННЫЙ", icon: list}
          - op: network_light_repair
            block: "Repair"
            block_ru: "Ремонт"
            icon: wrench
            guests:
              - {op: network_standard_repair, icon: wrench}
              - {op: network_nuclear_repair, icon: bomb}
          - op: network_proxy_status
            block: "Proxy"
            block_ru: "Прокси"
            icon: scan-search
            guests:
              - {op: network_proxy_disable_user, icon: power-off}
              - {op: network_proxy_reset_winhttp, icon: rotate-ccw}

      - id: hosts
        title: "HOSTS"
        title_ru: "HOSTS"
        about: "A site name pointed to an address in the local network through the hosts file, and back"
        about_ru: "Имя сайта на адрес в локальной сети через файл hosts и обратно"
        icon: file-cog
        state: true
        cards:
          - op: bitrix_detect_endpoint
            block: "Check"
            block_ru: "Проверка"
            icon: radar
            guests:
              - {op: bitrix_status, icon: scan-search}
          - switch: hosts_override
            block: "Override"
            block_ru: "Подмена"
            icon: file-cog
            options:
              - {op: bitrix_enable, is: "on", title: "ON", title_ru: "ВКЛЮЧЕНА", icon: toggle-right}
              - {op: bitrix_disable, is: "off", title: "OFF", title_ru: "ВЫКЛЮЧЕНА", icon: toggle-left}
          - {op: bitrix_restore, block: "Roll back", block_ru: "Откат", icon: history}

  - id: wsl
    title: "WSL & VM"
    title_ru: "WSL И VM"
    about: "WSL, Ubuntu on a disk, the hypervisor, the sandbox"
    about_ru: "WSL, Ubuntu на диск, гипервизор, песочница"
    icon: box
    pages:
      - id: wsl
        title: "WSL"
        title_ru: "WSL"
        about: "The engine of WSL, the distributions there are and their install"
        about_ru: "Движок WSL, какие дистрибутивы есть и их установка"
        icon: terminal
        cards:
          - op: wsl_system_status
            block: "Engine"
            block_ru: "Движок"
            icon: scan-search
            guests:
              - {op: wsl_enable_features, icon: power, tone: run}
              - {op: wsl_update_engine, icon: refresh-cw}
              - {op: wsl_shutdown, icon: square}
          - op: wsl_status
            block: "What there is"
            block_ru: "Что есть"
            icon: list
            guests:
              - {op: wsl_list, icon: list}
              - {op: wsl_list_online, icon: cloud}
          - {op: wsl_install_distro, block: "Install", block_ru: "Установка", icon: download, tone: run}
          - {op: wsl_install_from_file, block: "From an image file", block_ru: "Из файла образа", icon: file-down, tone: run}

      - id: setup
        title: "SETUP"
        title_ru: "НАСТРОЙКА"
        about: "Inside a distribution: packages, the account, developer packages, the shell"
        about_ru: "Внутри дистрибутива: пакеты, учётка, пакеты разработчика, оболочка"
        icon: settings-2
        cards:
          - {op: wsl_linux_apt_update, block: "Packages", block_ru: "Пакеты", icon: refresh-cw, tone: run}
          - {op: wsl_linux_account, block: "Account", block_ru: "Учётка", icon: user, tone: run}
          - {op: wsl_linux_dev_packages, block: "Developer packages", block_ru: "Dev-пакеты", icon: package, tone: run}
          - {op: wsl_micro_baseline, block: "Shell", block_ru: "Оболочка", icon: file-code}
          - {op: wsl_mc_skin, block: "Shell", block_ru: "Оболочка", icon: palette}
          - {op: wsl_neovim_base, block: "Shell", block_ru: "Оболочка", icon: code}

      - id: distro
        title: "DISTRIBUTION"
        title_ru: "ДИСТРИБУТИВ"
        about: "A distribution: stop it, copy, clone, move, restore, register, delete"
        about_ru: "Дистрибутив: остановить, копия, клон, перенос, восстановление, регистрация, удаление"
        icon: hard-drive
        cards:
          - {op: wsl_terminate, block: "Work", block_ru: "Работа", icon: square}
          - {op: wsl_backup, block: "Copy", block_ru: "Копия", icon: archive, tone: run}
          - {op: wsl_clone, block: "Clone and move", block_ru: "Клон и перенос", icon: copy}
          - {op: wsl_move, block: "Clone and move", block_ru: "Клон и перенос", icon: move, tone: burn}
          - {op: wsl_import_in_place, block: "Restore", block_ru: "Восстановление", icon: hard-drive-download}
          - {op: wsl_restore_from_backup, block: "Restore", block_ru: "Восстановление", icon: rotate-ccw, tone: run}
          - {op: wsl_register_all_vhdx, block: "Restore", block_ru: "Восстановление", icon: layers}
          - {op: wsl_delete, block: "Delete", block_ru: "Удаление", icon: trash-2, tone: burn}

      - id: ubuntu
        title: "UBUNTU"
        title_ru: "UBUNTU"
        about: "Ubuntu Dev Installer Kit: Ubuntu on a disk of its own beside Windows"
        about_ru: "Ubuntu Dev Installer Kit: Ubuntu на свой диск рядом с Windows"
        icon: disc
        cards:
          - op: ubuntu_dev_open_folder
            block: "Ubuntu Dev Installer Kit"
            block_ru: "Ubuntu Dev Installer Kit"
            icon: folder-open
            guests:
              - {op: ubuntu_dev_open_readme_ru, icon: book-open}
              - {op: ubuntu_dev_open_btrfs_guide, icon: book}
              - {op: ubuntu_dev_open_installer_script, icon: file-code}
              - {op: ubuntu_dev_open_nvme_prep_script, icon: file-code}
              - {op: ubuntu_dev_open_packages, icon: list}

      - id: hyperv
        title: "HYPER-V"
        title_ru: "HYPER-V"
        about: "The mode of the hypervisor, Hyper-V and Windows Sandbox; they change after a restart"
        about_ru: "Режим гипервизора, Hyper-V и Windows Sandbox; меняются после перезагрузки"
        icon: server
        state: true
        cards:
          - op: virt_status
            block: "State"
            block_ru: "Состояние"
            icon: scan-search
            guests:
              - {op: virt_optimization_status, icon: gauge}
          - switch: hypervisor
            block: "Hypervisor mode"
            block_ru: "Режим гипервизора"
            icon: server
            options:
              - {op: virt_mode_hyperv, is: hyperv, title: "HYPER-V / WSL2", title_ru: "HYPER-V / WSL2", icon: server}
              - {op: virt_mode_thirdparty, is: thirdparty, title: "THIRD-PARTY VM", title_ru: "СТОРОННИЕ VM", icon: box}
              - {op: virt_mode_coexist, is: coexist, title: "COEXISTENCE (WHP)", title_ru: "СОСУЩЕСТВОВАНИЕ (WHP)", icon: combine}
          - switch: hyperv_feature
            block: "Windows components"
            block_ru: "Компоненты Windows"
            title: "Hyper-V"
            title_ru: "Hyper-V"
            icon: server
            options:
              - {op: virt_hyperv_enable, is: "on", title: "ON", title_ru: "ВКЛ", icon: toggle-right}
              - {op: virt_hyperv_disable, is: "off", title: "OFF", title_ru: "ВЫКЛ", icon: toggle-left}
          - switch: sandbox_feature
            block: "Windows components"
            block_ru: "Компоненты Windows"
            title: "Windows Sandbox"
            title_ru: "Windows Sandbox"
            icon: box
            options:
              - {op: virt_sandbox_enable, is: "on", title: "ON", title_ru: "ВКЛ", icon: toggle-right}
              - {op: virt_sandbox_disable, is: "off", title: "OFF", title_ru: "ВЫКЛ", icon: toggle-left}

  - id: drivers
    title: "DRIVERS"
    title_ru: "ДРАЙВЕРЫ"
    about: "Windows Update, locks, NVIDIA, Driver Store"
    about_ru: "Windows Update, замки, NVIDIA, Driver Store"
    icon: circuit-board
    pages:
      - id: wu
        title: "WINDOWS UPDATE"
        title_ru: "WINDOWS UPDATE"
        about: "Whether Windows Update may install drivers on this machine"
        about_ru: "Может ли Windows Update ставить драйверы на эту машину"
        icon: refresh-cw
        state: true
        cards:
          - {op: driver_update_status, block: "Drivers from Windows Update", block_ru: "Драйверы из Windows Update", icon: scan-search}
          - switch: wu_drivers
            block: "Drivers from Windows Update"
            block_ru: "Драйверы из Windows Update"
            icon: shield
            options:
              - {op: driver_update_unblock_all, is: allowed, title: "ALLOWED", title_ru: "РАЗРЕШЕНЫ", icon: lock-open}
              - {op: driver_update_block_all, is: blocked, title: "BLOCKED", title_ru: "ЗАБЛОКИРОВАНЫ", icon: lock}
          - op: driver_update_open_policy_backups
            block: "Folders"
            block_ru: "Папки"
            icon: folder-open
            guests:
              - {op: driver_update_open_tool, icon: folder}

      - id: hwid
        title: "HWID LOCK"
        title_ru: "ЗАМОК HWID"
        about: "A device whose driver Windows must not replace: take the lock off, update, put it back"
        about_ru: "Устройство, чей драйвер Windows не должна менять: снять замок, обновить, поставить обратно"
        icon: lock
        cards:
          - op: hwid_driver_status
            block: "Update a driver under the lock"
            block_ru: "Обновить драйвер под замком"
            icon: scan-search
            guests:
              - {op: hwid_driver_unblock, icon: lock-open}
              - {op: hwid_driver_block, icon: lock, tone: run}
          - op: hwid_driver_rank_status
            block: "Emergency rank repair"
            block_ru: "Аварийный ремонт ранга"
            icon: scan-search
            guests:
              - {op: hwid_driver_rank_repair, icon: wrench, tone: run}

      - id: nvidia
        title: "NVIDIA"
        title_ru: "NVIDIA"
        about: "Whether NVIDIA drivers may be installed; the sound of HDMI and DisplayPort"
        about_ru: "Можно ли ставить драйверы NVIDIA; звук HDMI и DisplayPort"
        icon: gpu
        state: true
        cards:
          - switch: nvidia_install
            block: "Driver installs"
            block_ru: "Установка драйверов"
            icon: shield
            options:
              - {op: nvidia_driver_unblock, is: allowed, title: "ALLOWED", title_ru: "РАЗРЕШЕНА", icon: lock-open}
              - {op: nvidia_driver_block, is: blocked, title: "BLOCKED", title_ru: "ЗАБЛОКИРОВАНА", icon: lock}
          - op: nvidia_audio_status
            block: "HDMI / DP sound"
            block_ru: "Звук HDMI / DP"
            icon: scan-search
            guests:
              - {op: nvidia_audio_export_ids, icon: upload}
          - switch: nvidia_audio_device
            block: "HDMI / DP sound"
            block_ru: "Звук HDMI / DP"
            title: "Device"
            title_ru: "Устройство"
            icon: speaker
            options:
              - {op: nvidia_audio_enable, is: "on", title: "ON", title_ru: "ВКЛ", icon: volume-2}
              - {op: nvidia_audio_disable, is: "off", title: "OFF", title_ru: "ВЫКЛ", icon: volume-x}
          - switch: nvidia_audio_policy
            block: "HDMI / DP sound"
            block_ru: "Звук HDMI / DP"
            title: "Policy"
            title_ru: "Политика"
            icon: shield
            options:
              - {op: nvidia_audio_unblock_policy, is: none, title: "NO BAN", title_ru: "ЗАПРЕТА НЕТ", icon: lock-open}
              - {op: nvidia_audio_block_policy, is: banned, title: "BANNED", title_ru: "ЗАПРЕЩЁН", icon: lock}
          - op: nvidia_audio_open_output
            block: "Folders"
            block_ru: "Папки"
            icon: folder-open
            guests:
              - {op: nvidia_audio_open_backup, icon: folder-open}
              - {op: nvidia_audio_open_tool, icon: folder}

      - id: store
        title: "DRIVER STORE"
        title_ru: "DRIVER STORE"
        about: "The drivers installed on this machine: a list, an export, a restore"
        about_ru: "Драйверы, стоящие на этой машине: список, экспорт, восстановление"
        icon: package
        cards:
          - op: driver_store_export
            block: "Driver Store"
            block_ru: "Driver Store"
            icon: upload
