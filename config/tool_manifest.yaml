      - id: default_apps_edge
        title: "Edge"
        title_ru: "Edge"
        description: "Keep Edge, but stop it from claiming links and file types that belong to another browser."
        description_ru: "Оставляет Edge на месте, но отучает его перетягивать ссылки и типы файлов у вашего основного браузера."
        service: "system_core.services.devops_tools:edge_calm"
        kind: "dangerous"
        risk_level: "system_change"
        parameters:
          mode: "edge_control"
        fields:
          - id: edge_owned_now
            type: "info_badges"
            span: "full"
            group: "action"
            label: "Что сейчас закреплено за Edge"
            label_ru: "Что сейчас закреплено за Edge"
            options_source: "system_core.services.devops_tools:edge_association_badges"
            refresh_label: "Обновить"
            refresh_label_ru: "Обновить"
            hint: "Live owner of every watched link and file type."
            hint_ru: |
              Живой список: чем сейчас открывается каждый тип. Жёлтым отмечено то, что забрал себе Edge.
              После смены браузера в параметрах Windows нажмите «Обновить».
          - id: edge_action
            type: "radio"
            display: "safety_buttons"
            span: "full"
            group: "action"
            label: "Action"
            label_ru: "Что сделать"
            default: "status"
            options:
              - value: "status"
                label: "Check - what Edge is allowed to do"
                label_ru: "Проверить — что сейчас держит Edge"
                icon: "fact_check"
                tone: "friendly"
                pair: "Inspect"
                pair_ru: "Проверка"
                summary: "Shows which link and file types Edge owns right now."
                summary_ru: "Показывает, какие ссылки и типы файлов сейчас забрал себе Edge."
                hint: "Lists the current owner of http, https, .htm, .html, .pdf, .svg and .webp, plus every managed policy value and the WebView2 version."
                hint_ru: |
                  Показывает построчно, чем сейчас открываются ссылки, .html, .pdf, .svg — и подсвечивает то, что забрал себе Edge.
                  Ниже — что Edge сейчас разрешено (навязываться, работать в фоне, показывать промо) и установлен ли WebView2.
                  Технически: HKCU UserChoice по наблюдаемым типам, значения HKLM Policies\Microsoft\Edge и EdgeUpdate, версия WebView2 Runtime, задачи MicrosoftEdge*.
              - value: "apply"
                label: "Stop Edge from claiming associations"
                label_ru: "Запретить Edge перетягивать ассоциации"
                icon: "volume_off"
                tone: "medium"
                pair: "Apply"
                pair_ru: "Применить"
                summary: "Edge stops asking to be default and stops the promo surfaces."
                summary_ru: "Edge перестаёт навязываться и показывать промо."
                hint: "Documented Edge group policies only - Edge stays installed and updated."
                hint_ru: |
                  Edge перестаёт просить стать браузером по умолчанию, показывать окно первого запуска и подсовывать промо-вкладки, из которых он и перехватывает типы файлов.
                  Сам Edge остаётся на месте и продолжает обновляться — им можно пользоваться как обычно, WebView2 явно защищён.
                  Чтобы уже отобранные типы вернулись к вашему браузеру, назначьте его в Windows и закрепите набор во вкладке «Политика».
                  Технически: документированные политики Microsoft Edge (ADMX) в HKLM и per-app политики Edge Update.
              - value: "revert"
                label: "Give Edge its freedom back"
                label_ru: "Вернуть Edge как было"
                icon: "undo"
                tone: "friendly"
                pair: "Apply"
                pair_ru: "Применить"
                summary: "Removes only the values written here."
                summary_ru: "Убирает только то, что записал этот раздел."
                hint: "Stock Edge behavior returns after a restart of the browser."
                hint_ru: |
                  Возвращает поведение Edge по умолчанию — со всеми подсказками и фоновым запуском.
                  Технически: удаление значений политик, записанных этим разделом.
              - value: "webview2"
                label: "Repair WebView2 Runtime"
                label_ru: "Починить WebView2"
                icon: "healing"
                tone: "medium"
                pair: "WebView2"
                pair_ru: "WebView2"
                summary: "Installs the official Evergreen runtime when it is missing."
                summary_ru: "Ставит официальный Evergreen-компонент, если его нет."
                hint: "Downloads the official Microsoft bootstrapper and installs it silently."
                hint_ru: |
                  Нужно, если программы с интерфейсом на WebView2 перестали открываться: панели, установщики, часть приложений Microsoft и сторонних.
                  Если компонент уже установлен, ничего не делает и просто показывает версию.
                  Технически: официальный Evergreen bootstrapper MicrosoftEdgeWebView2Setup.exe с go.microsoft.com, установка в тихом режиме.
            hint: "Edge is never uninstalled here - it is calmed down so your own browser keeps the file types."
            hint_ru: |
              Раздел не удаляет Edge и не ломает его: браузер остаётся рабочим и обновляемым.
              Задача другая — чтобы Edge перестал забирать ссылки, .pdf и .svg у вашего основного браузера, и чтобы WebView2, на котором работает интерфейс множества программ, был цел.
          - id: edge_level
            type: "radio"
            span: "full"
            group: "options"
            label: "How far to go"
            label_ru: "Насколько тихо"
            default: "calm"
            options:
              - value: "calm"
                label: "Calm - stop the nagging and the background"
                label_ru: "Спокойно — без навязывания и фона"
                hint: "Default browser prompts, first-run flow, startup boost, background mode, promo tabs and recommendations."
                hint_ru: |
                  Edge не просит стать браузером по умолчанию, не показывает первый запуск, не висит в фоне и не подсовывает промо-вкладки.
                  Все остальные функции браузера работают как обычно.
              - value: "quiet"
                label: "Quiet - also turn off side panels and extras"
                label_ru: "Тихо — плюс боковые панели и лишнее"
                hint: "Calm plus sidebar, Shopping, Collections, feedback, personalization reporting; Beta/Dev/Canary channels blocked."
                hint_ru: |
                  Всё, что в «Спокойно», плюс выключенные боковая панель, покупки, коллекции, отправка отзывов и персонализация.
                  Дополнительно запрещает самостоятельную установку каналов Beta/Dev/Canary.
          - id: dry_run
            type: "checkbox"
            group: "options"
            label: "Dry run"
            label_ru: "Пробный запуск"
            default: true
            hint: "Shows which policy values would be written or removed."
            hint_ru: |
              Показывает, какие настройки были бы записаны или убраны, ничего не меняя.

      - id: default_apps_watch
        title: "Tracking"
        title_ru: "Отслеживание"
        description: "Track association changes and manage the Audion Defender exclusions."
        description_ru: "Отслеживает смену ассоциаций и управляет исключениями Defender для папок Audion."
        service: "system_core.services.devops_tools:association_defense"
        kind: "dangerous"
        risk_level: "system_change"
        parameters:
          mode: "guards_control"
        fields:
          - id: guard_action
            type: "radio"
            display: "safety_buttons"
            span: "full"
            group: "action"
            label: "Action"
            label_ru: "Что сделать"
            default: "status"
            options:
              - value: "status"
                label: "Check"
                label_ru: "Проверить"
                tone: "friendly"
                pair: "Inspect"
                pair_ru: "Проверка"
                summary: "Read-only state of the selected items."
                summary_ru: "Только состояние выбранных пунктов."
                hint: "Shows whether the watcher task and the exclusions are in place."
                hint_ru: |
                  Показывает, работает ли предупреждение о смене программ по умолчанию и какие исключения Defender добавлены.
              - value: "enable"
                label: "Turn on"
                label_ru: "Включить"
                tone: "medium"
                pair: "Targets"
                pair_ru: "Пункты"
                summary: "Enables the selected items."
                summary_ru: "Включает выбранные пункты."
                hint: "Defender itself stays enabled; only Audion-managed exclusions are added."
                hint_ru: |
                  Включает выбранное. Защитник Windows при этом остаётся включённым — добавляются только исключения для папок и процессов Audion.
              - value: "disable"
                label: "Turn off"
                label_ru: "Выключить"
                tone: "medium"
                pair: "Targets"
                pair_ru: "Пункты"
                summary: "Removes only Audion-managed entries."
                summary_ru: "Убирает только записи, созданные Audion."
                hint: "Nothing outside the Audion-managed entries is touched."
                hint_ru: |
                  Убирает только то, что добавил Audion. Чужие исключения и задачи не трогает.
              - value: "run_check"
                label: "Check the defaults right now"
                label_ru: "Проверить изменения прямо сейчас"
                tone: "friendly"
                pair: "Watcher"
                pair_ru: "Наблюдатель"
                summary: "Runs the drift check immediately."
                summary_ru: "Запускает проверку немедленно."
                hint: "Compares the live associations with the saved snapshot and reports the difference."
                hint_ru: |
                  Сразу сверяет текущие программы по умолчанию с сохранённым снимком и показывает, что изменилось.
                  Требует выбранного пункта «Отслеживание смены ассоциаций».
          - id: guard_targets
            type: "checkboxes"
            display: "chips"
            span: "full"
            group: "options"
            label: "Targets"
            label_ru: "Что включить"
            default: ["Drift"]
            min_selected: 1
            group_accents:
              Tracking: "#38bdf8"
              Performance: "#4ade80"
            options:
              - value: "Drift"
                label: "Association change tracking"
                label_ru: "Отслеживание смены ассоциаций"
                group: "Tracking"
                group_ru: "Отслеживание"
                hint: "At-logon task that compares the live associations with the saved snapshot."
                hint_ru: |
                  При входе в систему сверяет программы по умолчанию со снимком и показывает уведомление, если что-то поменялось.
                  Ничего не восстанавливает само — только предупреждает.
              - value: "Defender"
                label: "Defender exclusions for Audion folders"
                label_ru: "Исключения Defender для папок Audion"
                group: "Performance"
                group_ru: "Быстродействие"
                hint: "Adds or removes only Audion-managed path/process exclusions; real-time protection stays on."
                hint_ru: |
                  Ускоряет работу инструментов Audion, убирая их папки из постоянной проверки.
                  Защита в реальном времени остаётся включённой, чужие исключения не затрагиваются.

      - id: default_apps_snapshot
        title: "Snapshot"
        title_ru: "Снимок"
        description: "Save and compare the association map of the current user."
        description_ru: "Сохраняет и сравнивает карту ассоциаций текущего пользователя."
        service: "system_core.services.devops_tools:association_defense"
        kind: "dangerous"
        risk_level: "user_write"
        parameters:
          mode: "snapshot_control"
        fields:
          - id: snapshot_action
            type: "radio"
            display: "safety_buttons"
            span: "full"
            group: "action"
            label: "Action"
            label_ru: "Что сделать"
            default: "status"
            options:
              - value: "status"
                label: "Compare the snapshot with what you have now"
                label_ru: "Сравнить снимок с текущим состоянием"
                tone: "friendly"
                pair: "Snapshot"
                pair_ru: "Снимок"
                summary: "Read-only comparison."
                summary_ru: "Только сравнение, без изменений."
                hint: "Shows which associations differ from the saved snapshot."
                hint_ru: |
                  Показывает, какие программы по умолчанию разъехались с сохранённым снимком.
              - value: "capture"
                label: "Save the current associations"
                label_ru: "Сохранить текущие ассоциации"
                tone: "medium"
                pair: "Snapshot"
                pair_ru: "Снимок"
                summary: "Writes the snapshot for the current user."
                summary_ru: "Записывает снимок для текущего пользователя."
                hint: "Per-user snapshot; it does not replace the machine-wide policy."
                hint_ru: |
                  Сохраняет набор программ текущего пользователя как снимок.
                  Это состояние одного пользователя — общесистемное закрепление живёт во вкладке «Политика».
              - value: "open_snapshots"
                label: "Open the snapshot folder"
                label_ru: "Открыть папку снимков"
                tone: "friendly"
                pair: "Folders"
                pair_ru: "Папки"
                summary: "Opens the folder with snapshots."
                summary_ru: "Открывает папку со снимками."
                hint: "Project-local snapshots folder."
                hint_ru: |
                  Открывает папку проекта со снимками.
            hint: "Records state. Putting associations back is the Policy tab's job."
            hint_ru: |
              Снимок фиксирует состояние: что и когда поменялось.
              Вернуть программы на место — задача вкладки «Политика»: Windows защищает
              личный выбор пользователя проверочной суммой, и подделывать её проект не станет.
          - id: snapshot_name
            type: "text"
            group: "source"
            label: "Snapshot name"
            label_ru: "Имя снимка"
            default: "Microsoft Snapshot"
            hint: "Readable name used in snapshot files."
            hint_ru: |
              Понятное имя, под которым сохраняется снимок.
          - id: snapshot_machine
            type: "text"
            group: "source"
            section: "advanced"
            label: "Machine tag"
            label_ru: "Метка машины"
            default: ""
            placeholder: "пусто = имя компьютера"
            hint: "Empty value uses COMPUTERNAME."
            hint_ru: |
              Необязательная метка, если снимки собираются с нескольких машин.
          - id: dry_run
            type: "checkbox"
            group: "options"
            label: "Dry run"
            label_ru: "Пробный запуск"
            default: true
            hint: "Capture respects dry run."
            hint_ru: |
              Сохранение снимка учитывает пробный запуск.

      - id: default_apps_groups
        title: "Groups"
        title_ru: "Группы"
        description: "Capture associations group by group while the right apps are installed."
        description_ru: "Сохраняет ассоциации по группам — фото, аудио, видео, PDF, браузер — пока нужные программы установлены."
        service: "system_core.services.devops_tools:association_defense"
        kind: "dangerous"
        risk_level: "user_write"
        parameters:
          mode: "groups_control"
        fields:
          - id: group_action
            type: "radio"
            display: "safety_buttons"
            span: "full"
            group: "action"
            label: "Action"
            label_ru: "Что сделать"
            default: "status"
            options:
              - value: "status"
                label: "Check the groups"
                label_ru: "Проверить группы"
                tone: "friendly"
                pair: "Inspect"
                pair_ru: "Проверка"
                summary: "Read-only comparison per group."
                summary_ru: "Сравнение по каждой группе, без изменений."
                hint: "Shows which groups exist and how they differ from the live state."
                hint_ru: |
                  Показывает, какие группы уже сохранены и чем они отличаются от текущего состояния.
              - value: "commit"
                label: "Save the selected group"
                label_ru: "Сохранить выбранную группу"
                tone: "medium"
                pair: "Group"
                pair_ru: "Группа"
                summary: "Captures only the selected group."
                summary_ru: "Сохраняет только выбранную группу."
                hint: "Do this while the app you want for that group is installed and set."
                hint_ru: |
                  Делайте это, пока нужная программа установлена и уже назначена для этой группы файлов.
              - value: "compose"
                label: "Build one snapshot from the groups"
                label_ru: "Собрать общий снимок из групп"
                tone: "medium"
                pair: "Compose"
                pair_ru: "Сборка"
                summary: "Merges the groups into the main snapshot."
                summary_ru: "Объединяет группы в общий снимок."
                hint: "The result becomes the snapshot used by the Snapshot tab."
                hint_ru: |
                  Собирает из отдельных групп один общий снимок, которым потом пользуется вкладка «Снимок».
            hint: "Groups record state per file family; they do not write associations back."
            hint_ru: |
              Группы фиксируют состояние по семействам файлов, а не расставляют программы обратно.
              Вернуть их на место — задача вкладки «Политика».
          - id: group_name
            type: "radio"
            display: "mode_buttons"
            span: "full"
            group: "source"
            label: "Group"
            label_ru: "Группа"
            default: "photo"
            options:
              - value: "photo"
                label: "Photo"
                label_ru: "Фото"
                accent: "#38bdf8"
                hint: "67 image types, including camera RAW."
                hint_ru: |
                  67 типов изображений: обычные (.jpg, .png, .webp, .heic, .avif),
                  печать и дизайн (.psd, .svg, .tiff, .eps) и сырые снимки камер
                  (.arw, .cr3, .nef, .dng и другие).
              - value: "audio"
                label: "Audio"
                label_ru: "Аудио"
                accent: "#a78bfa"
                hint: "51 audio types, lossless to legacy."
                hint_ru: |
                  51 аудиоформат: без потерь (.flac, .wav, .ape), сжатые (.mp3, .m4a, .opus),
                  многоканальные (.ac3, .dts), MIDI и трекеры, а также старые (.ra, .mpc).
              - value: "video"
                label: "Video"
                label_ru: "Видео"
                accent: "#f472b6"
                hint: "38 video types, including transport streams."
                hint_ru: |
                  38 видеоформатов: современные (.mkv, .mp4, .webm), классические (.avi, .wmv),
                  транспортные потоки и DVD (.m2ts, .vob, .ts), мобильные и веб (.3gp, .flv).
              - value: "pdf"
                label: "PDF and books"
                label_ru: "PDF и книги"
                accent: "#f97316"
                hint: "Read-only document formats."
                hint_ru: |
                  Документы для чтения: .pdf, .djvu, .xps, .chm.
                  Самая спорная группа — .pdf чаще всего перехватывает Edge.
              - value: "documents"
                label: "Documents"
                label_ru: "Документы"
                accent: "#4ade80"
                hint: "Office and text documents."
                hint_ru: |
                  Офис и текст: .doc, .docx, .xls, .xlsx, .ppt, .pptx, .rtf, .txt, .md, .csv, .xml.
              - value: "archives"
                label: "Archives"
                label_ru: "Архивы"
                accent: "#fbbf24"
                hint: "Archives and disk images."
                hint_ru: |
                  Архивы и образы дисков: .7z, .zip, .rar, .tar, .gz, .iso, .img.
              - value: "browser"
                label: "Browser"
                label_ru: "Браузер"
                accent: "#22d3ee"
                hint: "Browser protocols and web file types."
                hint_ru: |
                  Ссылки и веб-типы: http, https, .htm, .html, .mht.
              - value: "custom"
                label: "Custom"
                label_ru: "Свой"
                accent: "#94a3b8"
                hint: "Your own name and extension list."
                hint_ru: |
                  Свой набор: задайте имя группы и перечислите расширения ниже.
          - id: group_custom_name
            type: "text"
            group: "source"
            label: "Custom group name"
            label_ru: "Имя своей группы"
            default: ""
            placeholder: "archive_video"
            hint: "Used when Group = Custom."
            hint_ru: |
              Нужно только для группы «Свой».
          - id: group_ext
            type: "text"
            span: "full"
            group: "source"
            label: "Custom extensions"
            label_ru: "Свои расширения"
            default: ""
            placeholder: ".mp4,.mkv,http"
            hint: "Only needed for a custom group or to override a built-in one."
            hint_ru: |
              Нужно для своей группы или чтобы переопределить состав готовой.
          - id: snapshot_name
            type: "text"
            group: "source"
            section: "advanced"
            label: "Snapshot name"
            label_ru: "Имя общего снимка"
            default: "Microsoft Snapshot"
            hint: "Target snapshot name for the compose action."
            hint_ru: |
              Имя снимка, который получится при сборке из групп.
          - id: snapshot_machine
            type: "text"
            group: "source"
            section: "advanced"
            label: "Machine tag"
            label_ru: "Метка машины"
            default: ""
            placeholder: "пусто = имя компьютера"
            hint: "Empty value uses COMPUTERNAME."
            hint_ru: |
              Необязательная метка машины.
          - id: dry_run
            type: "checkbox"
            group: "options"
            label: "Dry run"
            label_ru: "Пробный запуск"
            default: true
            hint: "Save and compose respect dry run."
            hint_ru: |
              Сохранение группы и сборка общего снимка учитывают пробный запуск.

      - id: default_apps_overview
        title: "Full report"
        title_ru: "Общий отчёт"
        description: "Run every read-only check in this section at once."
        description_ru: "Прогоняет все проверки этого раздела подряд и печатает единый отчёт."
        service: "system_core.services.devops_tools:association_defense"
        kind: "safe"
        parameters:
          mode: "overview_control"
          overview_action: "status_all"

  - id: hardware
    title: "Hardware"
    title_ru: "Hardware"
    description: "Driver update guard, NVIDIA install restrictions, NVIDIA HDMI/DP audio control, and disk procedures."
    description_ru: "Защита драйверов, NVIDIA install restrictions, контроль NVIDIA HDMI/DP Audio и дисковые процедуры Windows."
    surface: "device"
    section: "device_drivers"
    ui_layout: "flatten"
    children:
      - id: driver_firmware_audit
        title: "Driver/Firmware Audit"
        title_ru: "Driver/Firmware Audit"
        description: "Read-only Windows diagnostic report for problem devices, BIOS/EC, firmware resources and key signed drivers."
        description_ru: "Диагностический отчёт без изменений: проблемные устройства из Диспетчера устройств, BIOS/EC, firmware/UEFI resources и ключевые подписанные драйверы."
        section: "device_diagnostics"
        service: "system_core.services.devops_tools:driver_firmware_audit"
        kind: "safe"
        risk_level: "project_write"
        action_tone: "neutral"
        fields:
          - id: output_dir
            type: "folder"
            group: "output"
            label: "Output folder"
            label_ru: "Папка отчёта"
            default: "logs"
          - id: json
            type: "checkbox"
            group: "options"
            label: "Write JSON"
            label_ru: "Писать JSON"
            default: true
          - id: csv
            type: "checkbox"
            group: "options"
            label: "Write key-driver CSV"
            label_ru: "Писать CSV key drivers"
            default: true
          - id: open_report
            type: "checkbox"
            group: "options"
            label: "Open report in Notepad"
            label_ru: "Открыть отчёт в Notepad"
            default: false
        parameters:
          output_dir: "logs"
          json: true
          csv: true
          open_report: false

      - id: driver_firmware_audit_materials
        title: "Driver/Firmware Audit materials"
        title_ru: "Материалы Driver/Firmware Audit"
        description: "Open the project-local addon folder and notes used to add the audit workflow."
        description_ru: "Открыть project-local папку аддона и заметки, из которых добавлялся audit workflow."
        section: "device_diagnostics"
        children:
          - id: driver_firmware_audit_open_folder
            title: "Open addon folder"
            title_ru: "Открыть папку аддона"
            description: "Open tools/driver_firmware_audit."
            description_ru: "Открыть tools/driver_firmware_audit."
            service: "system_core.services.devops_tools:open_tool_folder"
            kind: "safe"
            parameters:
              folder: "tools/driver_firmware_audit"
          - id: driver_firmware_audit_open_readme
            title: "Open README"
            title_ru: "Открыть README"
            description: "Open the addon README from the project-local copy."
            description_ru: "Открыть README аддона из project-local copy."
            service: "system_core.services.devops_tools:open_project_path"
            kind: "safe"
            parameters:
              path: "tools/driver_firmware_audit/README.md"

      - id: driver_update_blocker
        title: "Driver Update Blocker"
        title_ru: "Driver Update Blocker"
        description: "Policy-level guard against Windows Update driver replacement, plus Driver Store backup/restore helpers."
        description_ru: "Policy-защита от подмены драйверов через Центр обновления Windows плюс backup/restore Driver Store."
        section: "device_drivers"
        ui_layout: "switcher"
        children:
          - id: driver_update_policy
            title: "Windows Update driver policy"
            title_ru: "Windows Update driver policy"
            description: "Check, enable, or remove the policy that excludes drivers from Windows Update quality updates."
            description_ru: "Проверить, включить или снять policy, которая исключает драйверы из обновлений качества Windows."
            children:
              - id: driver_update_status
                title: "Check driver protection"
                title_ru: "Проверить защиту драйверов"
                action_group: "Inspect"
                action_group_ru: "Проверка"
                action_group_tone: "neutral"
                description: "Read-only status: Windows Update driver policy, driver-search settings, device metadata policy, DeviceInstall restrictions, and present NVIDIA PCI devices."
                description_ru: "Статус без изменений: Windows Update driver policy, параметры поиска драйверов, device metadata policy, DeviceInstall restrictions и текущие NVIDIA PCI устройства."
                service: "system_core.services.devops_tools:driver_update_blocker"
                kind: "safe"
                parameters:
                  mode: "status"
              - id: driver_update_block_all
                title: "Block Windows Update drivers"
                title_ru: "Блокировать драйверы Windows Update"
                action_group: "Windows Update drivers"
                action_group_ru: "Windows Update drivers: block / unblock"
                action_group_tone: "neutral"
                action_tone: "medium"
                description: "Backs up current policy keys, sets ExcludeWUDriversInQualityUpdate=1, disables driver-wizard WU search and device metadata downloads, then runs gpupdate. Reboot is recommended."
                description_ru: "Делает backup policy-ключей, ставит ExcludeWUDriversInQualityUpdate=1, выключает поиск драйверов через мастер установки оборудования и загрузку метаданных устройств, затем запускает gpupdate. Рекомендуется перезагрузка."
                service: "system_core.services.devops_tools:driver_update_blocker"
                kind: "dangerous"
                risk_level: "system_change"
                parameters:
                  mode: "block_all"
              - id: driver_update_unblock_all
                title: "Unblock Windows Update drivers"
                title_ru: "Разблокировать драйверы Windows Update"
                action_group: "Windows Update drivers"
                action_group_ru: "Windows Update drivers: block / unblock"
                action_group_tone: "neutral"
                action_tone: "friendly"
                description: "Backs up current policy keys, removes the Windows Update driver block values, restores normal driver-search behavior, then runs gpupdate. Reboot is recommended."
                description_ru: "Делает backup policy-ключей, удаляет значения блокировки драйверов Центра обновления Windows, возвращает обычное поведение driver search, затем запускает gpupdate. Рекомендуется перезагрузка."
                service: "system_core.services.devops_tools:driver_update_blocker"
                kind: "dangerous"
                risk_level: "system_change"
                parameters:
                  mode: "unblock_all"
              - id: driver_update_open_policy_backups
                title: "Open policy backups"
                title_ru: "Открыть policy backups"
                action_group: "Policy backups"
                action_group_ru: "Policy backups"
                action_group_tone: "neutral"
                description: "Open registry-policy backup files created before block/unblock operations."
                description_ru: "Открыть backups policy-ключей реестра, которые создаются перед block/unblock операциями."
                service: "system_core.services.devops_tools:driver_update_blocker"
                kind: "safe"
                parameters:
                  mode: "open_policy_backups"

          - id: custom_hwid_driver_restrictions
            title: "Device driver HWID guard"
            title_ru: "HWID-защита драйвера устройства"
            description: "Simple workflow: unblock before a deliberate driver update, install the driver, then block the same HWID again."
            description_ru: "Простой порядок: разблокировать перед осознанным обновлением драйвера, поставить драйвер, затем снова заблокировать тот же HWID."
            fields:
              - id: hwid_builtin_cache_pins
                type: "profile_buttons"
                group: "target"
                label: "Preset"
                label_ru: "Preset"
                hint: "Restores the built-in Intel Iris Xe HWID. The REV alias is kept internally for status/unblock cleanup."
                hint_ru: "Возвращает встроенный Intel Iris Xe HWID. REV alias хранится внутри для status/unblock cleanup."
                presets:
                  - id: intel_iris_xe_46a8
                    label: "Use Intel Iris Xe"
                    label_ru: "Intel Iris Xe"
                    values:
                      target_hardware_ids: |
                        PCI\VEN_8086&DEV_46A8&SUBSYS_22E717AA
              - id: hwid_guard_identity_badges
                type: "info_badges"
                group: "target"
                label: "Driver identity"
                label_ru: "Идентификация"
                hint: "Informational only. The lock target stays in the HWID field below."
                hint_ru: "Только информация. Лочится HWID из поля ниже."
                items:
                  - label: "Generic"
                    label_ru: "Generic"
                    pair: "Lock target"
                    pair_ru: "Lock target"
                    tone: "lock"
                    summary: "OEM SUBSYS HWID, no REV"
                    summary_ru: "OEM SUBSYS HWID, без REV"
              - id: target_hardware_ids
                type: "textarea"
                group: "target"
                label: "HWID to protect"
                label_ru: "HWID для защиты"
                default: |
                  PCI\VEN_8086&DEV_46A8&SUBSYS_22E717AA
                placeholder: 'PCI\VEN_8086&DEV_46A8&SUBSYS_22E717AA'
                hint: "Leave this as-is for the current Intel Iris Xe. Use one OEM-specific SUBSYS HWID; the REV alias is handled internally."
                hint_ru: "Для текущей Intel Iris Xe оставь как есть. Нужен один OEM-specific SUBSYS HWID; REV alias обрабатывается внутри."
              - id: target_device_instance_id
                type: "text"
                group: "target"
                label: "Device Instance ID"
                label_ru: "Device Instance ID"
                advanced: true
                hint: "Optional. Used only for status/rank report when auto-detection is ambiguous."
                hint_ru: "Опционально. Нужен только для status/rank report, если auto-detection неоднозначен."
              - id: hwid_retroactive
                type: "checkbox"
                group: "options"
                label: "Retroactive block"
                label_ru: "Retroactive block"
                default: false
                hint: "Dangerous: Windows may remove or disable already installed matching devices."
                hint_ru: "Опасно: Windows может удалить или выключить уже установленные matching devices."
              - id: hwid_keep_global_wu_block
                type: "checkbox"
                group: "options"
                label: "Keep global WU driver block"
                label_ru: "Оставить global WU driver block"
                default: false
                advanced: true
                hint: "Default removes ExcludeWUDriversInQualityUpdate after the targeted HWID policy is written."
                hint_ru: "По умолчанию после записи targeted HWID policy удаляется ExcludeWUDriversInQualityUpdate."
            children:
              - id: hwid_driver_status
                title: "Check current lock"
                title_ru: "Проверить текущий lock"
                action_group: "Driver update workflow"
                action_group_ru: "Сценарий обновления драйвера"
                action_group_tone: "neutral"
                description: "Read-only check: shows whether this HWID is locked and which driver is currently best-ranked/installed."
                description_ru: "Проверка без изменений: показывает, залочен ли этот HWID и какой драйвер сейчас best-ranked/installed."
                service: "system_core.services.devops_tools:driver_update_blocker"
                kind: "safe"
                risk_level: "readonly"
                parameters:
                  mode: "status_hwid"
              - id: hwid_driver_unblock
                title: "1. Unblock before driver update"
                title_ru: "1. Разблокировать перед обновлением"
                action_group: "Driver update workflow"
                action_group_ru: "Сценарий обновления драйвера"
                action_group_tone: "neutral"
                action_tone: "friendly"
                description: "Use before installing the wanted manual/generic driver. Removes matching HWID locks while preserving unrelated policy entries."
                description_ru: "Нажать перед установкой нужного manual/generic драйвера. Удаляет matching HWID locks, сохраняя чужие policy entries."
                service: "system_core.services.devops_tools:driver_update_blocker"
                kind: "dangerous"
                risk_level: "system_change"
                parameters:
                  mode: "unblock_hwid"
              - id: hwid_driver_block
                title: "2. Block after driver install"
                title_ru: "2. Заблокировать после установки"
                action_group: "Driver update workflow"
                action_group_ru: "Сценарий обновления драйвера"
                action_group_tone: "neutral"
                action_tone: "medium"
                description: "Use after the wanted driver is installed and active. Adds this HWID to DenyDeviceIDs so Windows Driver Store/WU cannot replace it silently."
                description_ru: "Нажать после установки и проверки нужного драйвера. Добавляет этот HWID в DenyDeviceIDs, чтобы Windows Driver Store/WU не подменил его молча."
                service: "system_core.services.devops_tools:driver_update_blocker"
                kind: "dangerous"
                risk_level: "system_change"
                parameters:
                  mode: "block_hwid"

          - id: hwid_driver_rank_repair_tools
            title: "Emergency rank repair by HWID"
            title_ru: "Аварийный rank repair по HWID"
            description: "Use only when the system already picked the wrong OEM driver and normal unblock/install/block was not enough. Creates a REG/JSON preflight backup before destructive steps."
            description_ru: "Использовать только если система уже выбрала неправильный OEM-драйвер и обычного unblock/install/block не хватило. Перед опасными шагами создаёт REG/JSON preflight backup."
            fields:
              - id: hwid_builtin_cache_pins
                type: "profile_buttons"
                group: "target"
                label: "Preset"
                label_ru: "Preset"
                hint: "Restores the built-in Intel Iris Xe HWID. The REV alias is kept internally for status/unblock cleanup."
                hint_ru: "Возвращает встроенный Intel Iris Xe HWID. REV alias хранится внутри для status/unblock cleanup."
                presets:
                  - id: intel_iris_xe_46a8
                    label: "Use Intel Iris Xe"
                    label_ru: "Intel Iris Xe"
                    values:
                      target_hardware_ids: |
                        PCI\VEN_8086&DEV_46A8&SUBSYS_22E717AA
              - id: hwid_repair_identity_badges
                type: "info_badges"
                group: "target"
                label: "Repair markers"
                label_ru: "Repair markers"
                hint: "Informational only. Generic is the intended lock target; OEM REV is the cleanup alias from the old stuck state."
                hint_ru: "Только информация. Generic - целевой lock target; OEM REV - cleanup alias от старого зависшего состояния."
                items:
                  - label: "Generic"
                    label_ru: "Generic"
                    pair: "Target"
                    pair_ru: "Target"
                    tone: "lock"
                    summary: "PCI\\VEN_8086&DEV_46A8&SUBSYS_22E717AA"
                    summary_ru: "PCI\\VEN_8086&DEV_46A8&SUBSYS_22E717AA"
                  - label: "OEM REV alias"
                    label_ru: "OEM REV alias"
                    pair: "Repair cleanup"
                    pair_ru: "Repair cleanup"
                    tone: "oem-tail"
                    summary: "...&REV_0C"
                    summary_ru: "...&REV_0C"
              - id: target_hardware_ids
                type: "textarea"
                group: "target"
                label: "HWID to repair"
                label_ru: "HWID для ремонта"
                default: |
                  PCI\VEN_8086&DEV_46A8&SUBSYS_22E717AA
                placeholder: 'PCI\VEN_8086&DEV_46A8&SUBSYS_22E717AA'
                hint: "For the current Intel Iris Xe, leave this as-is. This section is not needed for a normal planned driver update."
                hint_ru: "Для текущей Intel Iris Xe оставь как есть. Этот раздел не нужен для обычного планового обновления драйвера."
              - id: target_device_instance_id
                type: "text"
                group: "target"
                label: "Device Instance ID"
                label_ru: "Device Instance ID"
                advanced: true
                hint: "Optional override when the Hardware ID matches more than one present device."
                hint_ru: "Опциональный override, если Hardware ID совпал с несколькими present devices."
              - id: bad_driver_version
                type: "text"
                group: "versions"
                label: "Bad driver version"
                label_ru: "Bad driver version"
                default: "32.0.101.7026"
                hint: "Current unwanted version expected before repair. Disable the version check in Advanced to bypass."
                hint_ru: "Текущая нежелательная версия перед ремонтом. В Advanced можно отключить проверку версии."
              - id: target_driver_version
                type: "text"
                group: "versions"
                label: "Target driver version"
                label_ru: "Target driver version"
                default: "32.0.101.7085"
                hint: "Desired driver version already present or extracted into DriverStore."
                hint_ru: "Нужная версия драйвера, уже установленная или распакованная в DriverStore."
              - id: target_inf_name_pattern
                type: "text"
                group: "advanced"
                label: "Target INF pattern"
                label_ru: "Target INF pattern"
                default: "*.inf"
                advanced: true
                hint: "Optional DriverStore search narrowing, for example iigd_dch.inf."
                hint_ru: "Опциональное сужение поиска в DriverStore, например iigd_dch.inf."
              - id: target_inf_path
                type: "text"
                group: "advanced"
                label: "Target INF path"
                label_ru: "Target INF path"
                advanced: true
                hint: "Optional exact INF path. When filled, it overrides DriverStore search."
                hint_ru: "Опциональный точный путь к INF. Если заполнен, заменяет поиск в DriverStore."
              - id: driver_rank_class
                type: "text"
                group: "advanced"
                label: "Driver class"
                label_ru: "Driver class"
                default: "Display"
                advanced: true
                hint: "Used for pnputil before/after reports only."
                hint_ru: "Используется только для before/after pnputil reports."
              - id: skip_current_version_check
                type: "checkbox"
                group: "advanced"
                label: "Skip current version check"
                label_ru: "Пропустить current version check"
                default: false
                advanced: true
                hint: "Expert mode: continue even when the current driver version is not the Bad driver version."
                hint_ru: "Expert mode: продолжить, даже если текущая версия драйвера не совпадает с Bad driver version."
              - id: allow_version_only_target_inf_fallback
                type: "checkbox"
                group: "advanced"
                label: "Allow version-only INF fallback"
                label_ru: "Разрешить INF fallback только по версии"
                default: false
                advanced: true
                hint: "Expert mode: if no INF contains the supplied HWID, allow choosing the newest INF with the target version anyway."
                hint_ru: "Expert mode: если ни один INF не содержит указанный HWID, разрешить выбор newest INF только по target version."
              - id: no_policy_block_after_repair
                type: "checkbox"
                group: "advanced"
                label: "Do not block HWID after repair"
                label_ru: "Не блокировать HWID после ремонта"
                default: false
                advanced: true
                hint: "Expert mode: skips the protective DenyDeviceIDs write after repair."
                hint_ru: "Expert mode: пропускает защитную запись DenyDeviceIDs после ремонта."
              - id: hwid_keep_global_wu_block
                type: "checkbox"
                group: "advanced"
                label: "Keep global WU driver block"
                label_ru: "Оставить global WU driver block"
                default: false
                advanced: true
                hint: "Default removes ExcludeWUDriversInQualityUpdate after the targeted HWID policy is written."
                hint_ru: "По умолчанию после записи targeted HWID policy удаляется ExcludeWUDriversInQualityUpdate."
            children:
              - id: hwid_driver_rank_status
                title: "Check rank target"
                title_ru: "Проверить rank target"
                action_group: "HWID rank repair"
                action_group_ru: "HWID rank repair"
                action_group_tone: "neutral"
                description: "Read-only target check: resolves the device by HWID, shows current signed driver data and pnputil driver/rank report."
                description_ru: "Read-only проверка target: определяет устройство по HWID, показывает current signed driver data и pnputil driver/rank report."
                service: "system_core.services.devops_tools:driver_update_blocker"
                kind: "safe"
                risk_level: "readonly"
                parameters:
                  mode: "repair_rank_hwid_status"
              - id: hwid_driver_rank_repair
                title: "Repair driver rank by HWID"
                title_ru: "Починить driver rank по HWID"
                action_group: "HWID rank repair"
                action_group_ru: "HWID rank repair"
                action_group_tone: "neutral"
                action_tone: "danger"
                description: "Creates a REG/JSON preflight backup, exports the old package, removes the bad current INF package, installs the target INF, rescans/restarts the device, then applies the targeted HWID block. Use only after checking the target."
                description_ru: "Создаёт REG/JSON preflight backup, экспортирует старый package, удаляет bad current INF package, ставит target INF, делает rescan/restart устройства, затем применяет targeted HWID block. Используй только после проверки target."
                service: "system_core.services.devops_tools:driver_update_blocker"
                kind: "dangerous"
                risk_level: "system_change"
                parameters:
                  mode: "repair_rank_hwid"

          - id: nvidia_driver_restrictions
            title: "NVIDIA driver install restrictions"
            title_ru: "NVIDIA driver install restrictions"
            description: "Optional Device Installation Restrictions for currently present NVIDIA PCI devices. Safer default is non-retroactive."
            description_ru: "Опциональные Device Installation Restrictions для текущих NVIDIA PCI устройств. Более безопасный default: без retroactive block."
            fields:
              - id: include_compatible_ids
                type: "checkbox"
                group: "options"
                label: "Include compatible IDs"
                label_ru: "Добавить compatible IDs"
                default: false
                hint: "Wider NVIDIA match. Leave off unless Hardware IDs alone are not enough."
                hint_ru: "Более широкий NVIDIA match. Оставь выключенным, если Hardware IDs хватает."
              - id: nvidia_retroactive
                type: "checkbox"
                group: "options"
                label: "Retroactive block"
                label_ru: "Retroactive block"
                default: false
                hint: "Dangerous: Windows may remove or disable already installed matching NVIDIA devices."
                hint_ru: "Опасно: Windows может удалить или выключить уже установленные совпадающие NVIDIA устройства."
            children:
              - id: nvidia_driver_block
                title: "Block NVIDIA driver installs"
                title_ru: "Блокировать NVIDIA driver installs"
                action_group: "NVIDIA restrictions"
                action_group_ru: "NVIDIA restrictions: block / unblock"
                action_group_tone: "neutral"
                action_tone: "medium"
                description: "Detects present NVIDIA PCI devices, writes their Hardware IDs into Device Installation Restrictions and runs gpupdate. Use before trusting a known-good manual/NVCleanstall driver."
                description_ru: "Находит текущие NVIDIA PCI устройства, пишет их Hardware IDs в Device Installation Restrictions и запускает gpupdate. Полезно после установки заведомо хорошего manual/NVCleanstall драйвера."
                service: "system_core.services.devops_tools:driver_update_blocker"
                kind: "dangerous"
                risk_level: "system_change"
                parameters:
                  mode: "block_nvidia"
              - id: nvidia_driver_unblock
                title: "Unblock NVIDIA driver installs"
                title_ru: "Разблокировать NVIDIA driver installs"
                action_group: "NVIDIA restrictions"
                action_group_ru: "NVIDIA restrictions: block / unblock"
                action_group_tone: "neutral"
                action_tone: "friendly"
                description: "Removes NVIDIA PCI IDs from Device Installation Restrictions while preserving non-NVIDIA entries in the same policy lists."
                description_ru: "Удаляет NVIDIA PCI IDs из Device Installation Restrictions, сохраняя не-NVIDIA entries в тех же policy lists."
                service: "system_core.services.devops_tools:driver_update_blocker"
                kind: "dangerous"
                risk_level: "system_change"
                parameters:
                  mode: "unblock_nvidia"

          - id: driver_store_backups
            title: "Driver Store backups"
            title_ru: "Driver Store backups"
            description: "Backup, export, and restore INF-based third-party drivers from the Windows Driver Store."
            description_ru: "Backup, export и restore INF-based third-party драйверов из Windows Driver Store."
            fields:
              - id: driver_backup_select
                type: "select"
