            label_ru: "LAN адаптер"
            options_source: "system_core.services.devops_tools:network_adapter_options"
            cache_seconds: 20
            searchable: true
          - id: wifi_adapter
            type: "select"
            label: "Wi-Fi adapter"
            label_ru: "Wi-Fi адаптер"
            options_source: "system_core.services.devops_tools:wifi_adapter_options"
            cache_seconds: 20
            searchable: true
          - id: wifi_profile
            type: "select"
            label: "Wi-Fi profile"
            label_ru: "Wi-Fi профиль"
            options_source: "system_core.services.devops_tools:wifi_profile_options"
            cache_seconds: 20
            searchable: true
          - id: wifi_profile_override
            type: "text"
            label: "Manual Wi-Fi profile"
            label_ru: "Wi-Fi профиль вручную"
