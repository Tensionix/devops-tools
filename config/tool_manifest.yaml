          mode: "restore"

  - id: default_apps
    title: "Default apps and Microsoft apps"
    title_ru: "Приложения по умолчанию"
    description: "Keep the programs that open your files, calm down the built-in Microsoft apps and Edge, and hold that state across Windows updates."
    description_ru: "Держит в порядке то, чем открываются ваши файлы: закрепляет выбранные программы, убирает лишние встроенные приложения Microsoft, успокаивает Edge и сохраняет это состояние после обновлений Windows."
    surface: "os"
    section: "os_policy"
    ui_layout: "switcher"
    children:
      - id: default_apps_policy
        title: "Policy"
        title_ru: "Политика"
        description: "Save the current set of default programs and make Windows restore it at every sign-in."
        description_ru: "Запоминает, какими программами открываются ваши файлы, и заставляет Windows возвращать этот набор при каждом входе."
        service: "system_core.services.devops_tools:default_apps_guard"
        kind: "dangerous"
        risk_level: "system_change"
        parameters:
          mode: "policy_control"
        fields:
          - id: policy_action
            type: "radio"
            display: "safety_buttons"
            span: "full"
            group: "action"
            label: "Action"
            label_ru: "Что сделать"
            default: "status"
            options:
              - value: "status"
                label: "Check - show what opens what"
                label_ru: "Проверить — чем сейчас открываются файлы"
                icon: "fact_check"
                tone: "friendly"
                pair: "Inspect"
                pair_ru: "Проверка"
                summary: "Read-only report; nothing is changed."
                summary_ru: "Только смотрит и ничего не меняет."
                hint: "Shows the program behind each tracked file type and protocol, and whether the saved set is currently enforced."
                hint_ru: |
                  Показывает, какая программа открывает каждый тип файла и ссылок, и включена ли защита выбранного набора.
                  Ничего не меняет: можно запускать в любой момент.
                  Технически: сравнивает HKCU UserChoice, эталонный XML и активный policy XML, показывает редакцию Windows и подсказки UCPD.
              - value: "snapshot"
                label: "Save a snapshot of the current state"
                label_ru: "Сохранить снимок текущего состояния"
                icon: "photo_camera"
                tone: "friendly"
                pair: "Snapshot"
                pair_ru: "Снимок"
                summary: "Timestamped copy in the project backup folder."
                summary_ru: "Копия с датой в папке резервных копий проекта."
                hint: "Writes the current defaults to a timestamped backup without touching the managed reference."
                hint_ru: |
                  Записывает нынешний набор программ по умолчанию в файл с датой — на случай, если захочется вернуться.
                  Управляемый эталон при этом не меняется.
                  Технически: DISM export текущих ассоциаций в backup\default_apps с .note.txt.
              - value: "export"
                label: "Make the current state the reference"
                label_ru: "Экспортировать текущие ассоциации в эталон"
                icon: "bookmark_added"
                tone: "medium"
                pair: "Reference"
                pair_ru: "Эталон"
                summary: "Current defaults become the set that will be enforced."
                summary_ru: "Текущий набор становится тем, который будет закрепляться."
                hint: "Replaces the managed reference with the current defaults; enforcement still needs the Enable action."
                hint_ru: |
                  Сначала настройте программы по умолчанию так, как вам нужно, затем нажмите это — набор станет эталоном.
                  Сам по себе он ещё ничего не закрепляет: для этого есть «Закрепить набор».
                  Технически: перезапись profiles\default_apps\AppAssociations.xml плюс timestamp backup.
              - value: "import"
                label: "Take the reference from a file"
                label_ru: "Взять эталон из файла"
                icon: "file_upload"
                tone: "medium"
                pair: "Reference"
                pair_ru: "Эталон"
                summary: "Load a saved snapshot or a file from another machine."
                summary_ru: "Загружает сохранённый снимок или файл с другой машины."
                hint: "Validates the XML, backs up the previous reference and copies the new one in."
                hint_ru: |
                  Берёт готовый набор — свой прежний снимок или файл с другого компьютера — и делает его эталоном.
                  Предыдущий эталон сохраняется в резервной копии.
                  Технически: проверка DISM AppAssociations XML и копирование в profiles\default_apps.
              - value: "apply"
                label: "Enable / repair the protection"
                label_ru: "Закрепить сохранённые ассоциации"
                icon: "lock"
                tone: "danger"
                pair: "Protection"
                pair_ru: "Защита набора"
                summary: "Windows restores the reference set at every sign-in."
                summary_ru: "Windows будет возвращать эталонный набор при каждом входе."
                hint: "Copies the reference to ProgramData, sets the machine policy and runs gpupdate."
                hint_ru: |
                  После этого Windows будет сама возвращать сохранённый набор программ при каждом входе — приложения перестанут перетягивать типы файлов на себя.
                  Изменение вступит в силу после выхода из учётной записи или перезагрузки.
                  Технически: копия эталона в %ProgramData%, HKLM policy DefaultAssociationsConfiguration, gpupdate. Нужна Windows Pro/Enterprise/Education.
              - value: "remove"
                label: "Turn the protection off"
                label_ru: "Снять закрепление"
                icon: "lock_open"
                tone: "medium"
                pair: "Protection"
                pair_ru: "Защита набора"
                summary: "Windows stops restoring the set; current defaults stay as they are."
                summary_ru: "Windows перестаёт возвращать набор; текущие программы остаются как есть."
                hint: "Backs up and removes the machine policy value, then runs gpupdate."
                hint_ru: |
                  Отключает автоматический возврат набора. То, что сейчас открывает файлы, останется прежним — просто перестанет восстанавливаться.
                  Технически: backup и удаление HKLM DefaultAssociationsConfiguration, затем gpupdate.
              - value: "cleanup"
                label: "Prune old backups"
                label_ru: "Убрать старые резервные копии"
                icon: "delete_sweep"
                tone: "danger"
                pair: "Backups"
                pair_ru: "Резервные копии"
                summary: "Deletes unnamed timestamp backups older than the retention window."
                summary_ru: "Удаляет безымянные копии старше заданного срока."
                hint: "Named backups, manual files and .note.txt sidecars are always kept. Dry run is on by default."
                hint_ru: |
                  Чистит только автоматические копии с датой, которые старше указанного срока хранения.
                  Копии с вашей меткой, ручные файлы и заметки .note.txt не трогает. По умолчанию включён пробный запуск.
              - value: "open_profiles"
                label: "Open the reference folder"
                label_ru: "Открыть папку эталона"
                icon: "folder_open"
                tone: "friendly"
                pair: "Folders"
                pair_ru: "Папки"
                summary: "Opens the folder with the reference XML."
                summary_ru: "Открывает папку, где лежит эталонный файл."
                hint: "Project-local profiles folder."
                hint_ru: |
                  Открывает папку проекта с эталонным набором.
                  Технически: profiles\default_apps.
              - value: "open_policy"
                label: "Open the active policy folder"
                label_ru: "Открыть папку закреплённого набора"
                icon: "folder_special"
                tone: "friendly"
                pair: "Folders"
                pair_ru: "Папки"
                summary: "Opens the ProgramData folder Windows reads."
                summary_ru: "Открывает папку, из которой Windows читает закреплённый набор."
                hint: "This is where Enable places the active XML."
                hint_ru: |
                  Открывает системную папку, куда кладётся закреплённый набор.
                  Технически: %ProgramData%\Audion\DefaultApps.
              - value: "open_backups"
                label: "Open the backup folder"
                label_ru: "Открыть папку резервных копий"
                icon: "inventory_2"
                tone: "friendly"
                pair: "Folders"
                pair_ru: "Папки"
                summary: "Opens the project backup folder."
                summary_ru: "Открывает папку резервных копий проекта."
                hint: "Timestamped XML and registry-value backups live here."
                hint_ru: |
                  Открывает папку, куда складываются снимки и копии значений реестра.
                  Технически: backup\default_apps.
            hint: "Everything here works on one saved set of default programs: look at it, save it, replace it, enforce it."
            hint_ru: |
              Все действия крутятся вокруг одного сохранённого набора программ по умолчанию: посмотреть, сохранить, заменить, закрепить.
              Обычный порядок: настроить программы в Windows -> «Экспортировать текущие ассоциации в эталон» -> «Закрепить сохранённые ассоциации».
