            title_ru: "Подключить профиль"
            action_group: "Wi-Fi status / connect"
            action_group_ru: "Wi-Fi: статус / подключение"
            action_group_tone: "neutral"
            action_tone: "medium"
            description: "Connect to the selected saved Wi-Fi profile, optionally through a selected adapter."
            description_ru: "Подключиться к выбранному сохранённому Wi-Fi профилю, при необходимости через выбранный адаптер."
            service: "system_core.services.devops_tools:wifi_connect"
            kind: "safe"
          - id: network_wifi_connection_mode
            title: "Profile autoconnect"
            title_ru: "Автоподключение профиля"
            action_group: "Wi-Fi profile settings"
            action_group_ru: "Настройки Wi-Fi профиля"
            action_group_tone: "neutral"
            action_tone: "medium"
            description: "Set the selected Wi-Fi profile to automatic or manual connection mode."
            description_ru: "Переключить выбранный Wi-Fi профиль в автоматический или ручной режим подключения."
