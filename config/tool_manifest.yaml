                    label: "Auto"
                    label_ru: "Авто"
                  - value: "manual"
                    label: "Manual"
                    label_ru: "Вручную"
          - id: network_wifi_export
            title: "Export profiles"
            title_ru: "Экспорт профилей"
            action_group: "Wi-Fi export / import"
            action_group_ru: "Wi-Fi profiles: export / import"
            action_group_tone: "neutral"
            action_tone: "medium"
            description: "Export Wi-Fi profiles to a selected folder; clear keys are included only when the checkbox is enabled."
            description_ru: "Экспортировать Wi-Fi профили в выбранную папку; ключи открытым текстом включаются только отдельным чекбоксом."
            service: "system_core.services.devops_tools:wifi_export_profiles"
            kind: "dangerous"
            risk_level: "secret_export"
            fields:
              - id: target_folder
                type: "folder"
                label: "Target folder"
                label_ru: "Папка сохранения"
                default: "output\\wifi_profiles"
              - id: include_keys
                type: "checkbox"
                label: "Include clear-text keys"
                label_ru: "Включить ключи открытым текстом"
                default: false
                hint: "Sensitive: exported XML files can contain Wi-Fi passwords."
                hint_ru: "Чувствительно: XML-файлы могут содержать пароли Wi-Fi."
          - id: network_wifi_import
            title: "Import profiles"
            title_ru: "Импорт профилей"
            action_group: "Wi-Fi export / import"
            action_group_ru: "Wi-Fi profiles: export / import"
            action_group_tone: "neutral"
            action_tone: "medium"
            description: "Import Wi-Fi profile XML files exported by netsh wlan."
            description_ru: "Импортировать XML-профили Wi-Fi, экспортированные через netsh wlan."
            fields:
              - id: import_user_scope
                type: "radio"
                label: "User scope"
                label_ru: "Область импорта"
                default: "current"
                options:
                  - value: "current"
                    label: "Current user"
                    label_ru: "Текущий пользователь"
                  - value: "all"
                    label: "All users"
                    label_ru: "Все пользователи"
                hint: "All users requires Administrator rights and will trigger UAC when needed."
                hint_ru: "Все пользователи требует прав администратора; GUI запросит UAC при необходимости."
              - id: wifi_adapter
                type: "select"
                label: "Wi-Fi adapter"
                label_ru: "Wi-Fi адаптер"
                options_source: "system_core.services.devops_tools:wifi_adapter_options"
                cache_seconds: 20
                searchable: true
                advanced: true
            children:
              - id: network_wifi_import_file
                title: "Import XML file"
                title_ru: "Импорт XML файла"
                action_group: "Import source"
                action_group_ru: "Источник импорта"
                action_group_tone: "neutral"
                description: "Add one Wi-Fi profile XML file to Windows."
                description_ru: "Добавить один XML-файл профиля Wi-Fi в Windows."
                service: "system_core.services.devops_tools:wifi_import_profiles"
                kind: "dangerous"
                risk_level: "system_change"
                parameters:
                  source_kind: "file"
                fields:
                  - id: import_profile_xml
                    type: "file"
                    label: "Profile XML"
                    label_ru: "XML профиль"
                    placeholder: "output\\wifi_profiles\\Wi-Fi-Name.xml"
              - id: network_wifi_import_folder
                title: "Import XML folder"
                title_ru: "Импорт папки XML"
                action_group: "Import source"
                action_group_ru: "Источник импорта"
                action_group_tone: "neutral"
                description: "Import all Wi-Fi profile XML files from a selected folder."
                description_ru: "Импортировать все XML-профили Wi-Fi из выбранной папки."
                service: "system_core.services.devops_tools:wifi_import_profiles"
                kind: "dangerous"
                risk_level: "system_change"
                parameters:
                  source_kind: "folder"
                fields:
                  - id: import_profile_folder
                    type: "folder"
                    label: "Profile XML folder"
                    label_ru: "Папка XML профилей"
                    default: "output\\wifi_profiles"
      - id: smb_network_login
        title: "SMB network login"
        title_ru: "SMB вход в сеть"
        action_group: "Windows file sharing"
        action_group_ru: "Общий доступ Windows"
        action_group_tone: "neutral"
        action_tone: "medium"
        description: "Open an external console for net use authentication to a Windows file-sharing computer; type the password there and the SMB session becomes available for Explorer."
        description_ru: "Открыть внешнюю консоль для net use входа к компьютеру с общими папками Windows: пароль вводится там, после этого SMB-сеанс доступен в Explorer."
        service: "system_core.services.devops_tools:smb_network_login"
