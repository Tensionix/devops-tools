            placeholder: ".html .svg mailto"
            hint: "Space, comma or semicolon separated extensions/protocols."
            hint_ru: |
              Дополнительные расширения или протоколы для отчёта, через пробел или запятую.
          - id: include_dism_inventory
            type: "checkbox"
            group: "options"
