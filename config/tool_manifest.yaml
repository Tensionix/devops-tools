        action_group_ru: "SSH keys: export / import"
        action_group_tone: "neutral"
        action_tone: "danger"
        description: "Export current user's .ssh keys/config/known_hosts/authorized_keys into output\\ssh_keykit."
        description_ru: "Экспортировать .ssh keys/config/known_hosts/authorized_keys текущего пользователя в output\\ssh_keykit."
        service: "system_core.services.devops_tools:ssh_keykit"
        kind: "dangerous"
        risk_level: "secret_export"
        parameters:
          mode: "export_client"
      - id: ssh_keykit_export_all
        title: "Export client + server SSH keys"
        title_ru: "Экспорт client + server SSH keys"
        action_group: "SSH keys export / import"
        action_group_ru: "SSH keys: export / import"
        action_group_tone: "neutral"
        action_tone: "danger"
        description: "Export current user's .ssh plus ProgramData\\ssh host keys and sshd_config when elevated."
        description_ru: "Экспортировать .ssh текущего пользователя плюс ProgramData\\ssh host keys и sshd_config при запуске с правами администратора."
        service: "system_core.services.devops_tools:ssh_keykit"
        kind: "dangerous"
        risk_level: "secret_export"
        parameters:
          mode: "export_all"
      - id: ssh_keykit_import_client
        title: "Import client SSH keys"
        title_ru: "Импорт client SSH keys"
        action_group: "SSH keys export / import"
        action_group_ru: "SSH keys: export / import"
        action_group_tone: "neutral"
        action_tone: "medium"
        description: "Copy current .ssh aside as .ssh.bak.timestamp, import the newest/selected client snapshot from input and fix private-key ACLs."
        description_ru: "Отложить текущую .ssh копией .ssh.bak.timestamp, импортировать свежий/выбранный client snapshot из input и починить ACL закрытых ключей."
        service: "system_core.services.devops_tools:ssh_keykit"
        kind: "dangerous"
        risk_level: "user_write"
        parameters:
          mode: "import_client"
      - id: ssh_keykit_import_all
        title: "Import client + server SSH keys"
        title_ru: "Импорт client + server SSH keys"
        action_group: "SSH keys export / import"
        action_group_ru: "SSH keys: export / import"
        action_group_tone: "neutral"
        action_tone: "danger"
        description: "Import client keys plus server host keys from input, fix ACLs, restart sshd and set it Automatic when elevated."
        description_ru: "Импортировать client keys плюс server host keys из input, починить ACL, перезапустить sshd и поставить startup type Automatic при запуске с правами администратора."
        service: "system_core.services.devops_tools:ssh_keykit"
        kind: "dangerous"
        risk_level: "system_change"
        parameters:
          mode: "import_all"
      - id: ssh_keykit_open_folder
        title: "Open KeyKit scripts folder"
        title_ru: "Открыть папку скриптов KeyKit"
        action_group: "Folders"
        action_group_ru: "Папки"
        action_group_tone: "neutral"
        description: "Open tools\\ssh_keykit with export/import scripts and wrapper commands; no key changes."
        description_ru: "Открыть tools\\ssh_keykit со scripts/wrappers export/import; без изменений ключей."
        service: "system_core.services.devops_tools:ssh_keykit"
        kind: "safe"
        parameters:
          mode: "open_tool_folder"

  - id: ai_backup
    title: "AI CLI Backup"
    title_ru: "Бэкап AI CLI"
    description: "Create and verify portable Claude Code and Codex backup bundles with atomic export, SHA-256 manifests and explicit auth handling."
    description_ru: "Создание и проверка переносимых бэкапов Claude Code и Codex: атомарный экспорт, manifest с SHA-256 и отдельное управление авторизацией."
    surface: "os_settings"
    section: "os_personal"
    children:
      - id: ai_backup_export
        title: "Backup (export)"
        title_ru: "Бэкап (экспорт)"
        action_group: "AI CLI backup / restore"
        action_group_ru: "AI CLI: бэкап / восстановление"
        action_group_tone: "neutral"
        action_tone: "medium"
        description: "Atomically export Claude and Codex into output\\ai_backup, then verify its manifest and SHA-256 hashes."
        description_ru: "Атомарно экспортировать Claude и Codex в output\\ai_backup, затем проверить manifest и SHA-256."
        service: "system_core.services.devops_tools:ai_backup"
        kind: "dangerous"
        risk_level: "secret_export"
        fields:
          - id: essentials
            type: "checkbox"
            label: "Move only the essentials"
            label_ru: "Перенести самое необходимое"
            default: true
            hint: "On keeps memory, settings, skills, plugins and automation. Off also adds full session history and caches."
            hint_ru: "Вкл сохраняет память, настройки, навыки, плагины и автоматизации. Выкл добавляет полную историю сессий и кэш."
          - id: include_auth
            type: "checkbox"
            label: "Include authentication secrets"
            label_ru: "Включить секреты авторизации"
            default: false
            hint: "Adds Claude .credentials.json and Codex auth.json when present. Treat the bundle like a password."
            hint_ru: "Добавляет Claude .credentials.json и Codex auth.json, если они есть. Храните такой бэкап как пароль."
        parameters:
          mode: "export"
      - id: ai_backup_import
        title: "Restore (import)"
        title_ru: "Восстановить (импорт)"
        action_group: "AI CLI backup / restore"
        action_group_ru: "AI CLI: бэкап / восстановление"
        action_group_tone: "neutral"
        action_tone: "danger"
        description: "Verify the backup staged in input, preview changes by default, then overwrite only selected matching files; unrelated local files stay."
        description_ru: "Проверить бэкап в input, по умолчанию показать план, затем заменить только выбранные совпадающие файлы; остальные локальные файлы сохраняются."
        service: "system_core.services.devops_tools:ai_backup"
        kind: "dangerous"
        risk_level: "user_write"
        fields:
          - id: essentials
            type: "checkbox"
            label: "Restore only the essentials"
            label_ru: "Восстановить только необходимое"
            default: true
            hint: "On ignores session history and caches even when the staged bundle is full."
            hint_ru: "Вкл не импортирует историю сессий и кэш, даже если в input лежит полный бэкап."
          - id: include_auth
            type: "checkbox"
            label: "Restore authentication secrets"
            label_ru: "Восстановить секреты авторизации"
            default: false
          - id: dry_run
            type: "checkbox"
            label: "Dry run"
            label_ru: "Пробный запуск"
            default: true
            hint: "Shows ADD/REPLACE/SAME without changing the profiles."
            hint_ru: "Показывает ADD/REPLACE/SAME без изменения профилей."
          - id: allow_foreign_paths
            type: "checkbox"
            label: "Allow saved absolute paths from another PC"
            label_ru: "Разрешить абсолютные пути другого ПК"
            default: false
            advanced: true
            hint: "Use only after reviewing the path warning printed by dry run."
            hint_ru: "Включайте только после проверки предупреждения о путях в пробном запуске."
          - id: allow_legacy
            type: "checkbox"
            label: "Allow legacy bundle without manifest"
            label_ru: "Разрешить старый бэкап без manifest"
            default: false
            advanced: true
        parameters:
          mode: "import"
      - id: ai_backup_merge
        title: "Merge memory"
        title_ru: "Объединение памяти"
        action_group: "AI CLI backup / restore"
        action_group_ru: "AI CLI: бэкап / восстановление"
        action_group_tone: "neutral"
        action_tone: "medium"
        description: "Verify the staged bundle and merge Claude .md memory, previewing by default. Name clashes are kept unless Overwrite is enabled."
        description_ru: "Проверить бэкап в input и объединить .md-память Claude с текущей, по умолчанию показав план. Совпадения сохраняются, пока не включён Overwrite."
        service: "system_core.services.devops_tools:ai_backup"
        kind: "dangerous"
        risk_level: "user_write"
        fields:
          - id: overwrite
            type: "checkbox"
            label: "Overwrite name clashes"
            label_ru: "Перезаписывать совпадения"
            default: false
          - id: dry_run
            type: "checkbox"
            label: "Dry run"
            label_ru: "Пробный запуск"
            default: true
          - id: allow_legacy
            type: "checkbox"
            label: "Allow legacy bundle without manifest"
            label_ru: "Разрешить старый бэкап без manifest"
            default: false
            advanced: true
        parameters:
          mode: "merge"
      - id: ai_backup_open
        title: "Open tool folder"
        title_ru: "Открыть папку инструмента"
        description: "Open tools\\ai_backup with the script and wrapper commands."
        description_ru: "Открыть tools\\ai_backup со скриптом и обёртками."
        service: "system_core.services.devops_tools:ai_backup"
        kind: "safe"
        parameters:
          mode: "open_tool_folder"

  - id: cert_keykit
    title: "Certificate KeyKit"
    title_ru: "Сертификаты (экспорт/импорт)"
    description: "Inspect, export and import Windows certificates so exportable keys survive reinstall; TPM-bound keys are flagged as non-exportable."
    description_ru: "Просмотр, экспорт и импорт сертификатов Windows: экспортируемые ключи переживут переустановку, а TPM-привязанные помечаются как non-exportable."
    surface: "os_settings"
    section: "os_personal"
    fields:
      - id: cert_store
        type: "select"
        group: "target"
        label: "Certificate store"
        label_ru: "Хранилище сертификатов"
        default: "CurrentUser\\My"
        options:
          - value: "CurrentUser\\My"
            label: "CurrentUser\\My (personal)"
          - value: "LocalMachine\\My"
            label: "LocalMachine\\My (personal)"
          - value: "CurrentUser\\Root"
            label: "CurrentUser\\Root (trusted roots)"
          - value: "LocalMachine\\Root"
            label: "LocalMachine\\Root (trusted roots)"
          - value: "CurrentUser\\CA"
            label: "CurrentUser\\CA (intermediate)"
          - value: "LocalMachine\\CA"
            label: "LocalMachine\\CA (intermediate)"
      - id: cert_backup_dir
        type: "folder"
        workbench_route: false
        group: "target"
        label: "Certificates folder"
        label_ru: "Папка сертификатов"
        default: ""
        placeholder: "output\\certificates"
        hint: "Where export writes: empty means output\\certificates. Import takes the file named in Advanced, not this folder."
        hint_ru: "Куда пишет экспорт: пусто — output\\certificates. Импорт берёт файл, указанный в Advanced, а не эту папку."
      - id: pfx_password
        type: "text"
        section: "advanced"
        label: "PFX password"
        label_ru: "Пароль PFX"
        default: ""
        hint: "Required for PFX export/import. Stored only for this run; the .pfx is encrypted with it."
        hint_ru: "Нужен для export/import PFX. Используется только в этом запуске; им шифруется .pfx."
      - id: import_file
        type: "file"
        section: "advanced"
        label: "Import file (.pfx/.cer/.crt/.sst)"
        label_ru: "Файл импорта (.pfx/.cer/.crt/.sst)"
        default: ""
        hint: "Put the file brought from another machine into input and pick it here."
        hint_ru: "Привезённый с другой машины файл кладите в input и выбирайте здесь."
      - id: import_store
        type: "select"
        section: "advanced"
        label: "Import target store"
        label_ru: "Целевое хранилище импорта"
