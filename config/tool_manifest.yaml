            hint_ru: "Выберите сохранённую пару или впишите новые значения отдельно. Формат записей: COMPUTER-NAME | User Name. Пароли не сохраняются."
          - id: smb_open_explorer
            type: "checkbox"
            label: "Open Explorer after login"
            label_ru: "Открыть Explorer после входа"
            default: true
      - id: network_adapter_apply
        title: "Adapter action"
        title_ru: "Действие адаптера"
        action_group: "Adapter control"
        action_group_ru: "Управление адаптером"
        action_group_tone: "neutral"
        description: "Enable, disable or restart the selected network adapter. Can interrupt active network connections."
        description_ru: "Включить, выключить или перезапустить выбранный сетевой адаптер. Может оборвать активное подключение."
        service: "system_core.services.devops_tools:network_adapter_action"
        kind: "dangerous"
        risk_level: "system_change"
        fields:
          - id: adapter
            type: "select"
            label: "Adapter"
            label_ru: "Адаптер"
            options_source: "system_core.services.devops_tools:network_adapter_options"
            cache_seconds: 20
            searchable: true
          - id: adapter_action
            type: "radio"
            label: "Action"
            label_ru: "Действие"
            default: "restart"
            options:
              - value: "restart"
                label: "Restart"
                label_ru: "Перезапуск"
              - value: "enable"
                label: "Enable"
                label_ru: "Включить"
              - value: "disable"
                label: "Disable"
                label_ru: "Выключить"
      - id: network_lan_wifi_switch
        title: "LAN/Wi-Fi switch"
        title_ru: "LAN/Wi-Fi переключатель"
        action_group: "LAN/Wi-Fi switching"
        action_group_ru: "LAN/Wi-Fi переключение"
        action_group_tone: "neutral"
        action_tone: "medium"
        description: "Switch to LAN only, Wi-Fi only, both enabled, or cycle Wi-Fi and reconnect a saved profile."
        description_ru: "Переключить LAN only, Wi-Fi only, включить оба адаптера или перезапустить Wi-Fi с подключением профиля."
        service: "system_core.services.devops_tools:lan_wifi_switch"
        kind: "dangerous"
        risk_level: "system_change"
        fields:
          - id: lan_adapter
            type: "select"
