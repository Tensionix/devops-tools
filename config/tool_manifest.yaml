      - id: default_apps_microsoft
        title: "Microsoft"
        title_ru: "Microsoft"
        description: "Remove or bring back the built-in Microsoft apps, and keep the decision valid after Windows updates."
        description_ru: "Убирает или возвращает встроенные приложения Microsoft и удерживает результат после обновлений Windows."
        service: "system_core.services.devops_tools:microsoft_apps"
        kind: "dangerous"
        risk_level: "system_change"
        parameters:
          mode: "apps_control"
        fields:
          - id: apps_action
            type: "radio"
            display: "safety_buttons"
            span: "full"
            group: "action"
            label: "Action"
            label_ru: "Что сделать"
            default: "status"
            options:
              - value: "status"
                label: "Check - what is installed"
                label_ru: "Проверить — что стоит в системе"
                icon: "fact_check"
                tone: "friendly"
                pair: "Inspect"
                pair_ru: "Проверка"
                summary: "Read-only list per app; nothing is changed."
                summary_ru: "Только показывает состояние каждого приложения."
                hint: "Shows installed / provisioned state per app plus the re-apply task state."
                hint_ru: |
                  Показывает по каждому отмеченному приложению: стоит ли оно сейчас и будет ли ставиться новым пользователям.
                  Заодно показывает, включено ли автоматическое повторное удаление после обновлений.
                  Технически: Get-AppxPackage -AllUsers, Get-AppxProvisionedPackage -Online, состояние задачи Audion-AppxRearm.
              - value: "remove"
                label: "Remove selected apps"
                label_ru: "Удалить отмеченные приложения"
                icon: "delete_sweep"
                tone: "medium"
                pair: "Removal"
                pair_ru: "Удаление"
                summary: "Removes them for every user and for new profiles."
                summary_ru: "Убирает у всех пользователей и у будущих новых профилей."
                hint: "Documented Appx removal; a Windows feature update can still bring them back."
                hint_ru: |
                  Убирает отмеченные приложения у всех пользователей компьютера и из заготовки для новых профилей.
                  Крупное обновление Windows может вернуть их обратно — от этого спасает «Удалить и держать удалёнными».
                  Технически: Remove-AppxPackage -AllUsers и Remove-AppxProvisionedPackage -Online.
              - value: "keep_removed"
                label: "Remove and keep them removed"
                label_ru: "Удалить и держать удалёнными"
                icon: "shield"
                tone: "danger"
                pair: "Removal"
                pair_ru: "Удаление"
                summary: "Removal plus a scheduled re-apply after every Windows build change."
                summary_ru: "Удаление плюс автоматическое повторение после смены сборки Windows."
                hint: "Removes now, adds AppLocker deny rules where supported, and registers the re-apply task."
                hint_ru: |
                  Убирает отмеченные приложения и запоминает решение: после крупного обновления Windows они будут удалены снова автоматически.
                  Это то, что нужно, если приложения возвращаются сами и снова перехватывают ваши файлы.
                  Технически: удаление пакетов, запрещающие правила AppLocker для упакованных приложений (там, где редакция позволяет) и плановая задача Audion-AppxRearm при старте системы.
              - value: "restore"
                label: "Bring the apps back"
                label_ru: "Вернуть приложения"
                icon: "restore"
                tone: "friendly"
                pair: "Restore"
                pair_ru: "Возврат"
                summary: "Reinstall and re-provision the selected apps."
                summary_ru: "Ставит приложения обратно и возвращает их новым профилям."
                hint: "Staged manifest, then family-name registration, then Microsoft Store; provisioning is restored afterwards."
                hint_ru: |
                  Возвращает отмеченные приложения: сначала из того, что уже лежит в системе, затем из Microsoft Store.
                  После установки они снова будут появляться и у новых пользователей.
                  Технически: Add-AppxPackage -Register / -RegisterByFamilyName, winget msstore, затем Add-AppxProvisionedPackage.
              - value: "provision"
                label: "Repair for new profiles only"
                label_ru: "Починить для новых пользователей"
                icon: "person_add"
                tone: "friendly"
                pair: "Restore"
                pair_ru: "Возврат"
                summary: "Re-provision without touching the current installation."
                summary_ru: "Возвращает приложение будущим профилям, не трогая текущую установку."
                hint: "Useful when an app works for you but is missing for freshly created users."
                hint_ru: |
