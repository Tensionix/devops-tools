  - id: ssh_keykit
    title: "OpenSSH KeyKit"
    title_ru: "OpenSSH KeyKit"
    description: "Project-local OpenSSH key export/import helper for client .ssh and optional server host keys."
    description_ru: "Project-local OpenSSH key export/import helper для client .ssh и optional server host keys."
    surface: "os_settings"
    section: "os_personal"
    fields:
      - id: ssh_root
        type: "folder"
        workbench_route: false
        group: "target"
        label: "Keys folder"
        label_ru: "Папка ключей"
        default: ""
        placeholder: "export: output\\ssh_keykit / import: input"
        hint: "Empty lets the operation choose: export writes to output\\ssh_keykit, import reads from input. A path here replaces both."
        hint_ru: "Пусто — папку выбирает операция: экспорт пишет в output\\ssh_keykit, импорт читает из input. Указанный путь заменяет обе."
      - id: profile_name
        type: "text"
        section: "advanced"
        label: "Machine/profile name"
        label_ru: "Machine/profile name"
        default: ""
        placeholder: "COMPUTERNAME"
      - id: user_name
        type: "text"
        section: "advanced"
        label: "Windows user"
        label_ru: "Windows user"
        default: ""
        placeholder: "USERNAME"
      - id: ssh_config_path
        type: "file"
        section: "advanced"
        label: "ssh config to check"
        label_ru: "Файл ssh config для проверки"
        default: ""
        placeholder: '%USERPROFILE%\.ssh\config'
        hint: "Empty value checks the current user's ssh config."
        hint_ru: "Пустое значение проверяет ssh config текущего пользователя."
      - id: rclone_config_path
        type: "file"
        section: "advanced"
        label: "rclone config to check"
        label_ru: "Файл rclone.conf для проверки"
        default: ""
        placeholder: "%APPDATA%\rclone\rclone.conf"
        hint: "Empty value checks the current user's rclone config."
        hint_ru: "Пустое значение проверяет rclone.conf текущего пользователя."
      - id: links_report_path
        type: "text"
        section: "advanced"
        label: "Save report to CSV"
        label_ru: "Сохранить отчёт в CSV"
        default: ""
        hint: "Empty value prints the table to the terminal only."
        hint_ru: "Пустое значение печатает таблицу только в терминал."
      - id: fail_on_broken
        type: "checkbox"
        section: "advanced"
        label: "Fail when a path is missing"
        label_ru: "Считать ошибкой отсутствующий путь"
        default: true
        hint: "Off reports the same list but finishes as success."
        hint_ru: "Выключено — тот же список, но операция завершается успехом."
      - id: snapshot
        type: "text"
        section: "advanced"
        label: "Snapshot for import"
        label_ru: "Snapshot для import"
        default: ""
        hint: "Empty value imports the newest snapshot for the selected profile/user."
        hint_ru: "Пустое значение импортирует самый свежий snapshot для выбранного profile/user."
    children:
      - id: ssh_keykit_check_links
        title: "Check access links"
        title_ru: "Проверить связность доступов"
        description: "Read ssh and rclone configuration and report every key, known_hosts and proxy path that no longer exists."
        description_ru: "Читает ssh и rclone конфигурацию и показывает каждый путь к ключу, known_hosts и прокси, которого больше нет."
        service: "system_core.services.devops_tools:ssh_keykit"
        kind: "safe"
        parameters:
          mode: "check_links"
      - id: ssh_keykit_export_client
