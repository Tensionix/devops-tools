              - id: driver_backup_path
                type: "folder"
                group: "source"
                label: "Manual backup folder"
                label_ru: "Backup folder вручную"
                hint: "Optional override: folder containing drivers\\ or INF files."
                hint_ru: "Опциональный override: папка с drivers\\ или INF-файлами."
            children:
              - id: driver_store_manifest
                title: "Save Driver Store manifest"
                title_ru: "Сохранить Driver Store manifest"
