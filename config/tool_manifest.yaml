tool:
  id: audion_devops_tools
  name: "Audion DevOps Tools"
  category: "DevOps"
  version: "0.1.0"

paths:
  input: "input"
  output: "output"
  backup: "backup"
  logs: "logs"
  workspace: "workspace"
  config: "config"
  release: "release"

ui:
  title: "Audion DevOps Tools"
  host: "127.0.0.1"
  port: 8092
  native: false
  reload: false
  open_browser: true

operation_groups:
  - id: runtime
    title: "Runtime and shell"
    title_ru: "Среда выполнения и оболочка"
    description: "Portable PowerShell, GUI runtime, and launcher checks."
    description_ru: "Портативный PowerShell, среда GUI и проверки оболочки."
    surface: "os"
    section: "os_core"
    children:
      - id: preflight_status
        title: "Preflight snapshot"
        title_ru: "Предварительный снимок"
        description: "One terminal snapshot: elevation, WSL, virtualization, PowerShell, network, Wi-Fi and disk risk flags."
        description_ru: "Один снимок в терминале: права администратора, WSL, виртуализация, PowerShell, сеть, Wi-Fi и риски дисков."
        service: "system_core.services.devops_tools:preflight_status"
        kind: "safe"
        action_group: "Environment diagnostics"
        action_group_ru: "Диагностика среды"
        action_group_tone: "neutral"
      - id: runtime_status
        title: "PowerShell runtime status"
        title_ru: "Статус PowerShell"
        description: "Show portable/system PowerShell resolution and version."
        description_ru: "Показать портативный/системный PowerShell и его версию."
        service: "system_core.services.devops_tools:runtime_status"
        kind: "safe"
        action_group: "Environment diagnostics"
        action_group_ru: "Диагностика среды"
        action_group_tone: "neutral"
      - id: windows_long_paths_status
        title: "Check Windows Long Paths"
        title_ru: "Проверить Windows Long Paths"
        description: "Show HKLM LongPathsEnabled and Git core.longpaths values. Does not change settings."
        description_ru: "Показать HKLM LongPathsEnabled и значения Git core.longpaths. Настройки не меняет."
        service: "system_core.services.devops_tools:windows_long_paths"
        kind: "safe"
        risk_level: "readonly"
        action_group: "Windows and Git long paths"
        action_group_ru: "Длинные пути Windows и Git"
        action_group_tone: "neutral"
        parameters:
          mode: "status"
      - id: windows_long_paths_enable
        title: "Enable Windows Long Paths"
        title_ru: "Включить Windows Long Paths"
        description: "Set HKLM LongPathsEnabled=1. Apps still need longPathAware manifest support."
        description_ru: "Установить HKLM LongPathsEnabled=1. Приложениям всё равно нужна поддержка longPathAware."
        service: "system_core.services.devops_tools:windows_long_paths"
        kind: "dangerous"
        risk_level: "system_change"
        action_group: "Windows and Git long paths"
        action_group_ru: "Длинные пути Windows и Git"
        action_group_tone: "neutral"
        parameters:
          mode: "enable_windows"
      - id: git_long_paths_enable
        title: "Enable Git Long Paths"
        title_ru: "Включить Git Long Paths"
        description: "Set git config --global core.longpaths true for the current user."
        description_ru: "Установить git config --global core.longpaths true для текущего пользователя."
        service: "system_core.services.devops_tools:windows_long_paths"
        kind: "dangerous"
        risk_level: "user_write"
        action_group: "Windows and Git long paths"
        action_group_ru: "Длинные пути Windows и Git"
        action_group_tone: "neutral"
        parameters:
          mode: "enable_git"
      - id: install_portable_powershell
        title: "Install portable PowerShell"
        title_ru: "Установить портативный PowerShell"
        description: "Download and install pwsh.exe into system_core/powershell."
        description_ru: "Скачать и установить pwsh.exe в system_core/powershell."
        service: "system_core.services.devops_tools:install_portable_powershell"
        kind: "safe"
        action_group: "Portable shell"
        action_group_ru: "Портативная оболочка"
        action_group_tone: "neutral"

  - id: browser_bookmarks_master
    title: "Browser Bookmarks Master"
    title_ru: "Browser Bookmarks Master"
    description: "Chromium bookmark export/import/transfer with multi-browser system selection, portable profiles, native backups and HTML import."
    description_ru: "Экспорт/импорт/перенос закладок Chromium: чекбоксы системных браузеров, portable-профили, нативные backup-папки и HTML."
    surface: "os"
    section: "os_browsers"
    fields:
      - id: browser_profile
        type: "select"
        group: "profile"
        label: "Browser"
        label_ru: "Браузер"
        default: "chrome"
        options_source: "system_core.services.devops_tools:chromium_browser_options"
        cache_seconds: 3600
        searchable: true
      - id: backup_label
        type: "text"
        group: "target"
        label: "Backup label"
        label_ru: "Имя backup"
        default: "bookmarks_master"
        placeholder: "bookmarks_master"
        hint: "Used only in the backup folder name. Required files stay canonical: Bookmarks and Favicons; Chromium sidecars are copied when present."
        hint_ru: "Используется только в имени папки backup. Обязательные файлы остаются каноническими: Bookmarks и Favicons; служебные sidecar-файлы Chromium копируются при наличии."
      - id: backup_version
        type: "text"
        group: "target"
        label: "Backup version"
        label_ru: "Версия backup"
        default: "auto"
        placeholder: "auto or v01"
        hint: "Folder suffix only. Empty/auto picks the next free vNN; an occupied explicit version is bumped instead of overwritten."
        hint_ru: "Только суффикс папки. Пусто/auto выбирает следующий свободный vNN; занятая явная версия повышается, а не перезаписывается."
      - id: close_browser_process
        type: "checkbox"
        group: "options"
        label: "Close browser before file operation"
        label_ru: "Закрыть браузер перед операцией"
        default: true
        hint: "Required for consistent SQLite Favicons copies. Disabling is expert-only."
        hint_ru: "Нужно для целостного копирования SQLite Favicons. Отключать только в expert-сценарии."
      - id: browser_profile_path
        type: "folder"
        group: "advanced"
        label: "Portable browser profile folder"
        label_ru: "Папка профиля portable-браузера"
        advanced: true
        placeholder: "%LOCALAPPDATA%\\Google\\Chrome\\User Data\\Default"
        hint: "Choose the exact profile folder containing Bookmarks for a portable or custom browser. Leave empty for standard auto-detection. The browser EXE folder alone is not enough."
        hint_ru: "Выбери точную папку профиля с файлом Bookmarks для portable или нестандартного браузера. Пусто = штатное автоопределение. Одной папки с browser EXE недостаточно."
      - id: backup_source_path
        type: "folder"
        group: "source"
        label: "Workbench source backup folder"
        label_ru: "Source backup папка Workbench"
        hint: "Hidden route field: filled from current Workbench SOURCE. Use it for import/status, including UNC network paths."
        hint_ru: "Скрытое route-поле: берётся из текущего Workbench SOURCE. Используется для import/status, включая UNC-сетевые пути."
      - id: backup_target_path
        type: "folder"
        group: "target"
        label: "Workbench target backup folder"
        label_ru: "Target backup папка Workbench"
        hint: "Hidden route field: filled from current Workbench TARGET. Use it for export/status, including UNC network paths."
        hint_ru: "Скрытое route-поле: берётся из текущего Workbench TARGET. Используется для export/status, включая UNC-сетевые пути."
    children:
      - id: browser_bookmarks_status
        title: "Status"
        title_ru: "Статус"
        action_group: "Inspect"
        action_group_ru: "Проверка"
        action_group_tone: "neutral"
        action_tone: "friendly"
        description: "Read-only check: selected browser profile files, process state and latest importable backup from Workbench SOURCE. GUI status can run for one or several checked browsers."
        description_ru: "Проверка без изменений: файлы выбранного профиля, состояние процесса и последний импортируемый backup из Workbench SOURCE. В GUI status можно запускать для одного или нескольких отмеченных браузеров."
        service: "system_core.services.devops_tools:browser_bookmarks_master"
        kind: "safe"
        risk_level: "readonly"
        parameters:
          mode: "status"
      - id: browser_bookmarks_clear_favicons
        title: "Clear local Favicons cache"
        title_ru: "Очистить локальный Favicons cache"
        action_group: "Repair local cache"
        action_group_ru: "Ремонт локального cache"
        action_group_tone: "neutral"
        action_tone: "medium"
        description: "Create a rollback backup, close selected browsers, then delete Favicons and sidecars. Chrome rebuilds an empty database but refetches icons only as pages are visited."
        description_ru: "Создаёт rollback backup, закрывает отмеченные браузеры и удаляет Favicons с sidecar-файлами. Chrome создаёт пустую базу, но возвращает иконки лишь по мере посещения страниц."
        service: "system_core.services.devops_tools:browser_bookmarks_master"
        kind: "dangerous"
        risk_level: "user_write"
        parameters:
          mode: "clear_favicons"
      - id: browser_bookmarks_export_master
        title: "Export master to Workbench TARGET"
        title_ru: "Экспорт эталона в Workbench TARGET"
        action_group: "Master state"
        action_group_ru: "Эталон: export / import"
        action_group_tone: "neutral"
        action_tone: "medium"
        description: "Close selected browsers and copy Bookmarks, Favicons and available Chromium sidecar files into versioned backup folders under Workbench TARGET."
        description_ru: "Закрывает выбранные браузеры и копирует Bookmarks, Favicons и доступные служебные sidecar-файлы Chromium в версионированные папки backup внутри Workbench TARGET."
        service: "system_core.services.devops_tools:browser_bookmarks_master"
        kind: "dangerous"
        risk_level: "secret_export"
        parameters:
          mode: "export_master"
      - id: browser_bookmarks_import_master
        title: "Import master from Workbench SOURCE"
        title_ru: "Импорт эталона из Workbench SOURCE"
        action_group: "Master state"
        action_group_ru: "Эталон: export / import"
        action_group_tone: "neutral"
        action_tone: "danger"
        description: "Import an explicitly selected native backup or HTML file into all checked system browsers; portable mode uses one exact profile. Each target gets a rollback backup."
        description_ru: "Импортирует выбранный нативный backup или HTML во все отмеченные системные браузеры; portable-режим работает с одним точным профилем. Для каждого создаётся rollback."
        service: "system_core.services.devops_tools:browser_bookmarks_master"
        kind: "dangerous"
        risk_level: "destructive"
        parameters:
          mode: "import_master"
      - id: browser_bookmarks_transfer_master
        title: "Transfer master between browsers"
        title_ru: "Перенести эталон между браузерами"
        action_group: "Master state"
        action_group_ru: "Эталон: export / import"
        action_group_tone: "neutral"
        action_tone: "danger"
        description: "Two-stage transfer: export the selected source browser into a project-local backup, then import that backup into selected target browsers with pre-import backups and Favicons cleanup."
        description_ru: "Двухэтапный перенос: выгружает выбранный браузер-источник в project-local backup, затем импортирует этот backup в выбранные браузеры-приёмники с pre-import backup и очисткой Favicons."
        service: "system_core.services.devops_tools:browser_bookmarks_master"
        kind: "dangerous"
        risk_level: "destructive"
        parameters:
          mode: "transfer_master"
      - id: browser_bookmarks_open_local_backup
        title: "Open local safety backups"
        title_ru: "Открыть локальные safety backups"
        action_group: "Folders"
        action_group_ru: "Папки"
        action_group_tone: "neutral"
        action_tone: "friendly"
        description: "Open project-local Browser Bookmarks backup folder with pre-import snapshots."
        description_ru: "Открыть project-local Browser Bookmarks backup с pre-import snapshots."
        service: "system_core.services.devops_tools:browser_bookmarks_master"
        kind: "safe"
        parameters:
          mode: "open_local_backup"

  - id: network
    title: "Network Cleaner"
    title_ru: "Очистка сети"
    description: "Windows network diagnostics, TimeMachine backup/restore, proxy and escalating repair profiles."
    description_ru: "Диагностика сети Windows, backup/restore в стиле TimeMachine, параметры прокси и профили ремонта по нарастанию силы."
    surface: "os"
    section: "os_network"
    children:
      - id: network_status
        title: "Status snapshot"
        title_ru: "Снимок статуса"
        action_group: "Inspect"
        action_group_ru: "Проверка"
        action_group_tone: "neutral"
        description: "Read-only baseline: collects ipconfig/routes/adapters/DNS/proxy/Wi-Fi status and writes a timestamped project-local diagnostic snapshot."
        description_ru: "Снимок состояния сети без изменений: собирает ipconfig, таблицу маршрутов, сетевые адаптеры, DNS, параметры прокси и Wi-Fi status, затем пишет timestamp backup в backup проекта."
        service: "system_core.services.devops_tools:network_cleaner"
        kind: "safe"
        parameters:
          mode: "Status"
      - id: network_backup
        title: "Backup network state"
        title_ru: "Полный backup сети"
        action_group: "Network backup / restore"
        action_group_ru: "Backup / restore сети"
        action_group_tone: "neutral"
        action_tone: "friendly"
        description: "Full Network Cleaner snapshot: adapters, IP/DNS/routes, proxy, firewall, registry and Wi-Fi XML without clear-text keys."
        description_ru: "Полный снимок Network Cleaner: сетевые адаптеры, IP/DNS, маршруты, прокси, Брандмауэр Защитника Windows, реестр и Wi-Fi XML без открытых ключей."
        service: "system_core.services.devops_tools:network_cleaner"
        kind: "safe"
        parameters:
          mode: "Backup"
      - id: network_backup_wifi_keys
        title: "Backup with Wi-Fi keys"
        title_ru: "Полный backup + Wi-Fi ключи"
        action_group: "Network backup / restore"
        action_group_ru: "Backup / restore сети"
        action_group_tone: "neutral"
        action_tone: "danger"
        description: "Sensitive snapshot: exports Wi-Fi profiles with clear-text keys into the Network Cleaner backup folder."
        description_ru: "Тот же полный снимок Network Cleaner плюс Wi-Fi XML с ключами открытым текстом. Для точечного переноса профилей используйте Wi-Fi профили."
        service: "system_core.services.devops_tools:network_cleaner"
        kind: "dangerous"
        risk_level: "secret_export"
        parameters:
          mode: "BackupWithWiFiKeys"
      - id: network_restore
        title: "Restore network backup"
        title_ru: "Восстановить backup сети"
        action_group: "Network backup / restore"
        action_group_ru: "Backup / restore сети"
        action_group_tone: "neutral"
        action_tone: "medium"
        description: "TimeMachine restore from a Network Cleaner snapshot. Creates a fresh backup before restore."
        description_ru: "Восстановление из снимка Network Cleaner в стиле TimeMachine. Перед восстановлением создаёт свежий backup текущего состояния."
        children:
          - id: network_restore_latest
            title: "Restore latest"
            title_ru: "Восстановить последний backup"
            action_group: "Restore target"
            action_group_ru: "Restore: последний / выбранный"
            action_group_tone: "neutral"
            action_tone: "medium"
            description: "Restore the newest Network Cleaner snapshot. First captures the current state, then imports saved registry/network/firewall/hosts/Wi-Fi data where available."
            description_ru: "Восстановить самый свежий снимок Network Cleaner. Сначала сохраняет текущее состояние, затем импортирует сохранённые данные реестра, сети, Брандмауэра Защитника Windows, hosts и Wi-Fi, где они доступны."
            service: "system_core.services.devops_tools:network_restore"
            kind: "dangerous"
            risk_level: "system_change"
            parameters:
              restore_mode: "latest"
          - id: network_restore_selected
            title: "Restore selected"
            title_ru: "Восстановить выбранный backup"
            action_group: "Restore target"
            action_group_ru: "Restore: последний / выбранный"
            action_group_tone: "neutral"
            action_tone: "medium"
            description: "Restore a selected Network Cleaner snapshot from the backup folder. Use when latest is not the state you want to return to."
            description_ru: "Восстановить выбранный снимок Network Cleaner из backup-папки. Используй, когда последний backup не тот, к которому нужно вернуться."
            service: "system_core.services.devops_tools:network_restore"
            kind: "dangerous"
            risk_level: "system_change"
            parameters:
              restore_mode: "selected"
            fields:
              - id: network_restore_snapshot
                type: "select"
                label: "Network backup"
                label_ru: "Backup сети"
                options_source: "system_core.services.devops_tools:network_backup_snapshot_options"
                cache_seconds: 20
                searchable: true
                refresh_label: "Refresh backups"
                refresh_label_ru: "Обновить backup-список"
      - id: network_repairs
        title: "Repair profiles"
        title_ru: "Профили ремонта"
        action_group: "Repair profiles"
        action_group_ru: "Repair: мягкий / обычный / сильный"
        action_group_tone: "neutral"
        description: "Escalating repair profiles. Each repair creates a project-local backup first."
        description_ru: "Профили ремонта по нарастанию силы. Каждый ремонт сначала создаёт локальный backup проекта."
        children:
          - id: network_light_repair
            title: "Light repair"
            title_ru: "Легкий ремонт"
            action_group: "Repair escalation"
            action_group_ru: "Repair: мягкий / обычный / сильный"
            action_group_tone: "neutral"
            action_tone: "medium"
            description: "Lowest-risk repair: flush/register DNS, clear ARP cache, refresh NetBIOS and renew DHCP only for connected DHCP interfaces."
            description_ru: "Самый мягкий ремонт: flush/register DNS, очистка ARP, обновление NetBIOS и DHCP renew только для подключённых DHCP-интерфейсов."
            service: "system_core.services.devops_tools:network_cleaner"
            kind: "dangerous"
            risk_level: "system_change"
            parameters:
              mode: "LightRepair"
          - id: network_standard_repair
            title: "Standard repair"
            title_ru: "Стандартный ремонт"
            action_group: "Repair escalation"
            action_group_ru: "Repair: мягкий / обычный / сильный"
            action_group_tone: "neutral"
            action_tone: "medium"
            description: "Normal escalation: resets Winsock, TCP/IP and WinHTTP proxy, then refreshes DNS and ARP. Reboot is recommended afterwards."
            description_ru: "Нормальная эскалация: сбрасывает Winsock, TCP/IP и WinHTTP proxy, затем обновляет DNS и ARP. После рекомендуется перезагрузка."
            service: "system_core.services.devops_tools:network_cleaner"
            kind: "dangerous"
            risk_level: "system_change"
            parameters:
              mode: "StandardRepair"
          - id: network_nuclear_repair
            title: "Nuclear repair"
            title_ru: "Жёсткий ремонт"
            action_group: "Repair escalation"
            action_group_ru: "Repair: мягкий / обычный / сильный"
            action_group_tone: "neutral"
            action_tone: "danger"
            description: "Heavy repair: Standard repair plus route flush; the original script still asks separately before the deepest reset steps."
            description_ru: "Тяжёлый ремонт: стандартный ремонт плюс очистка маршрутов; оригинальный скрипт отдельно спрашивает перед самыми глубокими reset-шагами."
            service: "system_core.services.devops_tools:network_cleaner"
            kind: "dangerous"
            risk_level: "system_change"
            parameters:
              mode: "NuclearRepair"
      - id: network_proxy
        title: "Proxy"
        title_ru: "Прокси"
        action_group: "Proxy"
        action_group_ru: "Proxy: status / reset"
        action_group_tone: "neutral"
        description: "Current-user and WinHTTP proxy commands."
        description_ru: "Команды прокси для текущего пользователя и WinHTTP."
        children:
          - id: network_proxy_status
            title: "Proxy status"
            title_ru: "Статус прокси"
            action_group: "Inspect"
            action_group_ru: "Проверка"
            action_group_tone: "neutral"
            description: "Show current-user WinINet/System proxy and machine-level WinHTTP proxy without changing them."
            description_ru: "Показать параметры прокси текущего пользователя WinINet/System и системный WinHTTP proxy без изменений."
            service: "system_core.services.devops_tools:windows_proxy_tool"
            kind: "safe"
            parameters:
              action: "Status"
          - id: network_proxy_disable_user
            title: "Disable user proxy"
            title_ru: "Отключить прокси пользователя"
            action_group: "Proxy cleanup"
            action_group_ru: "Proxy cleanup / reset"
            action_group_tone: "neutral"
            description: "Turns off current-user WinINet/System proxy settings. Useful after corporate/VPN/proxy tools leave stale proxy values."
            description_ru: "Отключает WinINet/System proxy текущего пользователя. Полезно после корпоративных, VPN или proxy-инструментов, которые оставили устаревшие параметры."
            service: "system_core.services.devops_tools:windows_proxy_tool"
            kind: "dangerous"
            risk_level: "user_write"
            parameters:
              action: "DisableUserProxy"
          - id: network_proxy_reset_winhttp
            title: "Reset WinHTTP proxy"
            title_ru: "Сбросить WinHTTP proxy"
            action_group: "Proxy cleanup"
            action_group_ru: "Proxy cleanup / reset"
            action_group_tone: "neutral"
            description: "Resets machine-level WinHTTP proxy used by services and some system tools. Does not edit browser/user proxy settings."
            description_ru: "Сбрасывает системный WinHTTP proxy для служб и части системных инструментов. Не правит прокси браузера и текущего пользователя."
            service: "system_core.services.devops_tools:windows_proxy_tool"
            kind: "dangerous"
            risk_level: "system_change"
            parameters:
              action: "ResetWinHttp"
      - id: network_open_backup
        title: "Open backup folder"
        title_ru: "Открыть backup"
        action_group: "Backup folders"
        action_group_ru: "Папки backup"
        action_group_tone: "neutral"
        description: "Open the project-local Network Cleaner backup folder with snapshots, restore manifests and run logs."
        description_ru: "Открыть project-local backup Network Cleaner со снимками, restore manifests и run logs."
        service: "system_core.services.devops_tools:network_cleaner"
        kind: "safe"
        parameters:
          mode: "OpenBackup"

  - id: lan_wifi
    title: "Connectivity"
    title_ru: "Подключение и адаптеры"
    description: "Adapter control, Wi-Fi profile management, and quick LAN/Wi-Fi modes."
    description_ru: "Управление адаптерами, Wi-Fi профилями и быстрые режимы LAN/Wi-Fi."
    surface: "device"
    section: "device_network"
    ui_layout: "switcher"
    children:
      - id: network_wifi
