          - id: switch_mode
            type: "radio"
            label: "Mode"
            label_ru: "Режим"
            default: "wifi_only"
            options:
              - value: "wifi_only"
                label: "Wi-Fi only"
                label_ru: "Только Wi-Fi"
              - value: "lan_only"
                label: "LAN only"
                label_ru: "Только LAN"
              - value: "both_on"
                label: "Both on"
                label_ru: "Оба включены"
              - value: "cycle_wifi"
                label: "Cycle Wi-Fi"
                label_ru: "Перезапустить Wi-Fi"
      - id: network_wifi_sticky_pair
