            label: "Full Windows list"
            label_ru: "Полный список Windows"
            default: false
            hint: "Adds the complete DISM default-associations inventory to the report."
            hint_ru: |
              Добавляет в отчёт полный перечень ассоциаций, который отдаёт сама Windows. Отчёт станет длинным.
              Технически: dism /Online /Get-DefaultAppAssociations.
          - id: remove_policy_xml
            type: "checkbox"
