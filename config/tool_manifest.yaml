        action_group_tone: "neutral"
        description: "List the selected store: subject, thumbprint, expiry, private key and exportability (flags TPM/non-exportable keys)."
        description_ru: "Список выбранного store: subject, thumbprint, срок действия, закрытый ключ и exportability (помечает TPM/non-exportable)."
        service: "system_core.services.devops_tools:certificate_keykit"
        kind: "safe"
        risk_level: "readonly"
        parameters:
          mode: "status"
      - id: cert_export_pfx
        title: "Export personal keys to PFX"
        title_ru: "Экспорт personal ключей в PFX"
        action_group: "Certificates export / import"
        action_group_ru: "Certificates: export / import"
        action_group_tone: "neutral"
        action_tone: "danger"
        description: "Export exportable private-key certs from the selected store to password-protected .pfx in output\\certificates. TPM-bound keys are skipped. Output contains PRIVATE KEYS."
        description_ru: "Экспорт сертификатов с экспортируемым закрытым ключом из выбранного store в password-protected .pfx в output\\certificates. TPM-ключи пропускаются. Файлы СОДЕРЖАТ закрытые ключи."
        service: "system_core.services.devops_tools:certificate_keykit"
        kind: "dangerous"
        risk_level: "secret_export"
        parameters:
          mode: "export_pfx"
      - id: cert_export_roots
        title: "Export store to SST (public)"
        title_ru: "Экспорт store в SST (публично)"
        action_group: "Certificates export / import"
        action_group_ru: "Certificates: export / import"
        action_group_tone: "neutral"
        action_tone: "medium"
        description: "Export the selected store's public certificates (no private keys) to a timestamped .sst bundle in output\\certificates."
        description_ru: "Экспорт публичных сертификатов выбранного store (без закрытых ключей) в .sst с timestamp в output\\certificates."
        service: "system_core.services.devops_tools:certificate_keykit"
        kind: "safe"
        risk_level: "project_write"
        parameters:
          mode: "export_roots"
      - id: cert_import_pfx
        title: "Import PFX"
        title_ru: "Импорт PFX"
        action_group: "Certificates export / import"
        action_group_ru: "Certificates: export / import"
        action_group_tone: "neutral"
        action_tone: "danger"
        description: "Import the selected .pfx (with password) into the target store, marking the key exportable. Changes the certificate store; reboot not required. Pick file and password in Advanced."
        description_ru: "Импортировать выбранный .pfx (с паролем) в целевой store, пометив ключ exportable. Меняет хранилище сертификатов; перезагрузка не нужна. Файл и пароль - в Advanced."
        service: "system_core.services.devops_tools:certificate_keykit"
        kind: "dangerous"
        risk_level: "system_change"
        parameters:
          mode: "import_pfx"
      - id: cert_import_pfx_folder
        title: "Import every PFX in the folder"
        title_ru: "Импорт всех PFX из папки"
        action_group: "Certificates export / import"
        action_group_ru: "Certificates: export / import"
        action_group_tone: "neutral"
        action_tone: "danger"
        description: "Import every .pfx listed in certificates.json, each into the store it was exported from, using one password. Changes the certificate store."
        description_ru: "Импортирует каждый .pfx из certificates.json в то хранилище, откуда он был выгружен, одним паролем. Меняет хранилище сертификатов."
        service: "system_core.services.devops_tools:certificate_keykit"
        kind: "dangerous"
        risk_level: "system_change"
        parameters:
          mode: "import_pfx_folder"
      - id: cert_import_cert
        title: "Import certificate / CA"
        title_ru: "Импорт сертификата / CA"
        action_group: "Certificates export / import"
        action_group_ru: "Certificates: export / import"
        action_group_tone: "neutral"
        action_tone: "medium"
        description: "Import a public .cer/.crt/.sst into the target store (e.g. trust a corporate root CA). Changes trust; choose target store carefully. Pick file in Advanced."
        description_ru: "Импортировать публичный .cer/.crt/.sst в целевой store (например, доверие корпоративному root CA). Меняет доверие; выбирайте store аккуратно. Файл - в Advanced."
        service: "system_core.services.devops_tools:certificate_keykit"
        kind: "dangerous"
        risk_level: "system_change"
        parameters:
          mode: "import_cert"
      - id: cert_open_folder
        title: "Open certificate export folder"
        title_ru: "Открыть папку экспорта сертификатов"
        action_group: "Folders"
        action_group_ru: "Папки"
        action_group_tone: "neutral"
        description: "Open output\\certificates; no certificate changes."
        description_ru: "Открыть output\\certificates; без изменений сертификатов."
        service: "system_core.services.devops_tools:certificate_keykit"
        kind: "safe"
        parameters:
          mode: "open_folder"

  - id: fonts_kit
    title: "User fonts"
    title_ru: "Шрифты пользователя"
    description: "Carry the fonts installed for this user only. The system set in C:\\Windows\\Fonts is read for counting and never written."
    description_ru: "Переносит шрифты, установленные только для этого пользователя. Системный набор в C:\\Windows\\Fonts читается лишь для счёта и не изменяется."
    surface: "os_settings"
    section: "os_personal"
    fields:
      - id: fonts_folder
        type: "folder"
        workbench_route: false
        group: "target"
        label: "Fonts folder"
        label_ru: "Папка шрифтов"
        default: ""
        placeholder: "export: output\\fonts / import: input"
        hint: "Empty lets the operation choose: collecting goes to output\\fonts, installing reads input."
        hint_ru: "Пусто — папку выбирает операция: сборка идёт в output\\fonts, установка читает input."
      - id: include_system
        type: "checkbox"
        section: "advanced"
        label: "List system fonts too"
        label_ru: "Показывать и системные шрифты"
        default: false
        hint: "Only changes what the list prints; system fonts are never carried or installed."
        hint_ru: "Влияет только на вывод списка; системные шрифты не переносятся и не ставятся."
    children:
      - id: fonts_status
        title: "Show my fonts"
        title_ru: "Показать мои шрифты"
        action_group: "Inspect"
        action_group_ru: "Проверка"
        action_group_tone: "neutral"
        description: "List the fonts installed for this user with [ OK ] or [MISS], and count the system ones. Changes nothing."
        description_ru: "Перечисляет шрифты, установленные для этого пользователя, с пометкой [ OK ] или [MISS], и считает системные. Ничего не меняет."
        service: "system_core.services.devops_tools:fonts_kit"
        kind: "safe"
        risk_level: "readonly"
        parameters:
          mode: "status"
      - id: fonts_export
        title: "Export my fonts"
        title_ru: "Экспорт моих шрифтов"
        action_group: "Fonts export / import"
        action_group_ru: "Шрифты: экспорт / импорт"
        action_group_tone: "neutral"
        action_tone: "medium"
        description: "Copy the user's font files into output\\fonts with a map of their registered names. System fonts are not copied."
        description_ru: "Копирует файлы пользовательских шрифтов в output\\fonts вместе с картой их зарегистрированных имён. Системные не копируются."
        service: "system_core.services.devops_tools:fonts_kit"
        kind: "safe"
        risk_level: "project_write"
        parameters:
          mode: "export"
      - id: fonts_import
        title: "Import fonts"
        title_ru: "Импорт шрифтов"
        action_group: "Fonts export / import"
        action_group_ru: "Шрифты: экспорт / импорт"
        action_group_tone: "neutral"
        action_tone: "medium"
        description: "Install the collected fonts for this user only: file into the profile, name under HKCU, running programs notified. Needs no administrator and leaves C:\\Windows\\Fonts alone."
        description_ru: "Ставит собранные шрифты только для этого пользователя: файл в профиль, имя в HKCU, запущенным программам сообщается. Прав администратора не нужно, C:\\Windows\\Fonts не затрагивается."
        service: "system_core.services.devops_tools:fonts_kit"
        kind: "dangerous"
        risk_level: "user_write"
        parameters:
          mode: "import"
      - id: fonts_open_folder
        title: "Open fonts folder"
        title_ru: "Открыть папку шрифтов"
        action_group: "Folders"
        action_group_ru: "Папки"
        action_group_tone: "neutral"
        description: "Open output\\fonts; collects nothing."
        description_ru: "Открыть output\\fonts; ничего не собирает."
        service: "system_core.services.devops_tools:fonts_kit"
        kind: "safe"
        parameters:
          mode: "open_folder"

  - id: shell_kit
    title: "Shell environment"
    title_ru: "Среда оболочки"
    description: "Carry the Windows Terminal settings and the PowerShell profile. Each file goes where its id resolves on the new machine, not where it lived here."
    description_ru: "Переносит настройки Windows Terminal и профиль PowerShell. Каждый файл ложится туда, где его место на новой машине, а не по старому пути."
    surface: "os_settings"
