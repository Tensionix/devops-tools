                action_group_ru: "Driver Store: backup / export / restore"
                action_group_tone: "neutral"
                action_tone: "friendly"
                description: "Saves pnputil, systeminfo and Get-WindowsDriver reports without exporting driver packages."
                description_ru: "Сохраняет отчёты pnputil, systeminfo и Get-WindowsDriver без экспорта driver packages."
                service: "system_core.services.devops_tools:driver_update_blocker"
                kind: "safe"
                parameters:
                  mode: "backup_manifest"
              - id: driver_store_export
                title: "Export installed drivers"
                title_ru: "Экспортировать установленные драйверы"
                action_group: "Driver Store backup / export / restore"
                action_group_ru: "Driver Store: backup / export / restore"
                action_group_tone: "neutral"
                action_tone: "medium"
                description: "Exports currently staged third-party drivers from Driver Store into a timestamped backup folder using Export-WindowsDriver or DISM fallback."
                description_ru: "Экспортирует текущие third-party drivers из Driver Store в timestamp backup через Export-WindowsDriver или DISM fallback."
                service: "system_core.services.devops_tools:driver_update_blocker"
                kind: "safe"
