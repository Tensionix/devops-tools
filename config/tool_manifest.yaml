    fields:
      - id: shell_folder
        type: "folder"
        workbench_route: false
        group: "target"
        label: "Shell folder"
        label_ru: "Папка среды оболочки"
        default: ""
        placeholder: "export: output\\shell / import: input"
        hint: "Empty lets the operation choose: collecting goes to output\\shell, restoring reads input."
        hint_ru: "Пусто — папку выбирает операция: сборка идёт в output\\shell, восстановление читает input."
    children:
      - id: shell_status
        title: "Show shell files"
        title_ru: "Показать файлы оболочки"
        action_group: "Inspect"
        action_group_ru: "Проверка"
        action_group_tone: "neutral"
        description: "List the Windows Terminal settings and PowerShell profiles this machine has, with [ OK ] or [ -- ]. Changes nothing."
        description_ru: "Перечисляет настройки Windows Terminal и профили PowerShell, которые есть на этой машине, с пометкой [ OK ] или [ -- ]. Ничего не меняет."
        service: "system_core.services.devops_tools:shell_kit"
        kind: "safe"
        risk_level: "readonly"
        parameters:
          mode: "status"
      - id: shell_export
        title: "Export shell files"
        title_ru: "Экспорт файлов оболочки"
        action_group: "Shell export / import"
        action_group_ru: "Оболочка: экспорт / импорт"
        action_group_tone: "neutral"
        action_tone: "medium"
        description: "Copy the found settings and profiles into output\\shell with a map of what each file is."
        description_ru: "Копирует найденные настройки и профили в output\\shell вместе с картой, что есть что."
        service: "system_core.services.devops_tools:shell_kit"
        kind: "safe"
        risk_level: "project_write"
        parameters:
          mode: "export"
      - id: shell_import
        title: "Import shell files"
        title_ru: "Импорт файлов оболочки"
        action_group: "Shell export / import"
        action_group_ru: "Оболочка: экспорт / импорт"
        action_group_tone: "neutral"
        action_tone: "medium"
        description: "Put each collected file where it belongs on this machine, keeping a dated copy of anything replaced. A file identical to the one already there is left alone."
        description_ru: "Кладёт каждый собранный файл туда, где его место на этой машине, сохраняя копию с датой у заменяемого. Совпадающий файл не трогает."
        service: "system_core.services.devops_tools:shell_kit"
        kind: "dangerous"
        risk_level: "user_write"
        parameters:
          mode: "import"
      - id: shell_open_folder
        title: "Open shell folder"
        title_ru: "Открыть папку среды оболочки"
        action_group: "Folders"
        action_group_ru: "Папки"
        action_group_tone: "neutral"
        description: "Open output\\shell; collects nothing."
        description_ru: "Открыть output\\shell; ничего не собирает."
        service: "system_core.services.devops_tools:shell_kit"
        kind: "safe"
        parameters:
          mode: "open_folder"

  - id: access_kit
    title: "Configured access"
    title_ru: "Доступы из конфигурации"
    description: "Carry the files that ssh and rclone configuration names — keys, known_hosts, certificates — wherever they live, and point the configuration at them on the new machine."
    description_ru: "Переносит файлы, названные в конфигурации ssh и rclone, — ключи, known_hosts, сертификаты, — где бы они ни лежали, и на новой машине переписывает конфигурацию под их новое место."
    surface: "os_settings"
    section: "os_personal"
    fields:
      - id: access_folder
        type: "folder"
        workbench_route: false
        group: "target"
        label: "Access folder"
        label_ru: "Папка доступов"
        default: ""
        placeholder: "export: output\\access / import: input"
        hint: "Empty lets the operation choose: collecting goes to output\\access, laying out reads input."
        hint_ru: "Пусто — папку выбирает операция: сборка идёт в output\\access, раскладка читает input."
      - id: access_key_root
        type: "folder"
        workbench_route: false
        group: "target"
        label: "Where keys land here"
        label_ru: "Куда лягут ключи здесь"
        default: ""
        placeholder: "%USERPROFILE%\\.ssh\\linked"
        hint: "Used when laying out: the configuration is rewritten to point at this folder."
        hint_ru: "Нужна при раскладке: конфигурация переписывается на эту папку."
      - id: ssh_config_path
        type: "file"
        section: "advanced"
        label: "ssh config"
        label_ru: "Файл ssh config"
        default: ""
        placeholder: '%USERPROFILE%\.ssh\config'
        hint: "Empty uses the current user's ssh config."
        hint_ru: "Пустое значение берёт ssh config текущего пользователя."
      - id: rclone_config_path
        type: "file"
        section: "advanced"
        label: "rclone config"
        label_ru: "Файл rclone.conf"
        default: ""
        placeholder: "%APPDATA%\rclone\rclone.conf"
        hint: "Empty uses the current user's rclone config."
        hint_ru: "Пустое значение берёт rclone.conf текущего пользователя."
    children:
      - id: access_status
        title: "Show what configuration names"
        title_ru: "Показать, что названо в конфигурации"
        action_group: "Inspect"
        action_group_ru: "Проверка"
        action_group_tone: "neutral"
        description: "List every key, known_hosts, certificate and proxy path named in ssh and rclone configuration, with [ OK ] or [MISS]. Changes nothing."
        description_ru: "Перечисляет каждый ключ, known_hosts, сертификат и путь к прокси из конфигурации ssh и rclone с пометкой [ OK ] или [MISS]. Ничего не меняет."
        service: "system_core.services.devops_tools:access_kit"
        kind: "safe"
        risk_level: "readonly"
        parameters:
          mode: "status"
      - id: access_export
        title: "Export configured access"
        title_ru: "Экспорт файлов доступов"
        action_group: "Access export / import"
        action_group_ru: "Доступы: экспорт / импорт"
        action_group_tone: "neutral"
        action_tone: "danger"
        description: "Copy ssh config, rclone.conf and every file they name into output\\access with a map of where each came from. Contains PRIVATE KEYS."
        description_ru: "Копирует ssh config, rclone.conf и каждый названный ими файл в output\\access вместе с картой происхождения. Содержит ЗАКРЫТЫЕ КЛЮЧИ."
        service: "system_core.services.devops_tools:access_kit"
        kind: "dangerous"
        risk_level: "secret_export"
        parameters:
          mode: "export"
      - id: access_import
        title: "Import configured access"
        title_ru: "Импорт файлов доступов"
        action_group: "Access export / import"
        action_group_ru: "Доступы: экспорт / импорт"
        action_group_tone: "neutral"
        action_tone: "danger"
        description: "Put the carried files under the chosen root, rewrite ssh and rclone configuration to match, restrict key ACLs, then check the links. Replaces both configuration files, keeping a dated copy of each."
        description_ru: "Кладёт привезённые файлы в выбранную папку, переписывает под них конфигурацию ssh и rclone, ограничивает права на ключи и проверяет связность. Заменяет оба файла конфигурации, сохраняя копию с датой."
        service: "system_core.services.devops_tools:access_kit"
        kind: "dangerous"
        risk_level: "user_write"
        parameters:
          mode: "import"

  - id: migration_kit
    title: "Machine migration"
    title_ru: "Переезд на новую машину"
    description: "Collect every access the packs can carry into one folder with an inventory, and unpack it on the new machine."
    description_ru: "Собрать в одну папку с описью все доступы, которые умеют переносить паки, и развернуть их на новой машине."
    surface: "os_settings"
    section: "os_personal"
    fields:
      - id: migration_folder
        type: "folder"
        workbench_route: false
        group: "target"
        label: "Migration folder"
        label_ru: "Папка переезда"
        default: ""
        placeholder: "export: output\\migration / import: input"
        hint: "Empty lets the operation choose: collecting goes to output\\migration, unpacking reads the newest migration in input."
        hint_ru: "Пусто — папку выбирает операция: сборка идёт в output\\migration, развёртывание читает самый свежий переезд в input."
      - id: profile_name
        type: "text"
        section: "advanced"
        label: "Machine name for the folder"
        label_ru: "Имя машины в названии папки"
        default: ""
        placeholder: "COMPUTERNAME"
        hint: "Empty uses this computer's name."
        hint_ru: "Пустое значение подставляет имя этого компьютера."
      - id: user_name
        type: "text"
        section: "advanced"
        label: "Windows user"
        label_ru: "Пользователь Windows"
        default: ""
        placeholder: "USERNAME"
        hint: "Empty uses the current user."
        hint_ru: "Пустое значение берёт текущего пользователя."
      - id: pfx_password
        type: "text"
        section: "advanced"
        label: "PFX password"
        label_ru: "Пароль PFX"
        default: ""
        hint: "Certificates are encrypted with it. Left empty, every other item still travels and the inventory records the gap."
        hint_ru: "Им шифруются сертификаты. Если пусто, остальные строки уезжают, а пробел записывается в опись."
    children:
      - id: migration_plan
        title: "Show what travels"
        title_ru: "Показать состав переезда"
        action_group: "Inspect"
        action_group_ru: "Проверка"
        action_group_tone: "neutral"
        description: "Read config\\migration_plan.yaml and list every item, its pack, its folder and whether it can be imported unattended. Changes nothing."
        description_ru: "Читает config\\migration_plan.yaml и перечисляет строки состава: пак, папку и можно ли развернуть без рук. Ничего не меняет."
        service: "system_core.services.devops_tools:migration_kit"
        kind: "safe"
        risk_level: "readonly"
        parameters:
          mode: "plan"
      - id: migration_verify
        title: "Check access after a move"
        title_ru: "Проверить доступы после переезда"
        action_group: "Inspect"
        action_group_ru: "Проверка"
        action_group_tone: "neutral"
        description: "Run the same access-link check the SSH pack runs: every key, known_hosts and proxy path named in ssh and rclone configuration."
        description_ru: "Тот же разбор путей, что и в паке SSH: каждый ключ, known_hosts и прокси, названные в конфигурации ssh и rclone."
        service: "system_core.services.devops_tools:migration_kit"
        kind: "safe"
        risk_level: "readonly"
        parameters:
          mode: "verify"
      - id: migration_export
        title: "Export the migration"
        title_ru: "Экспорт переезда"
        action_group: "Migration export / import"
        action_group_ru: "Переезд: экспорт / импорт"
        action_group_tone: "neutral"
        action_tone: "danger"
        description: "Walk the plan, call each pack and collect everything into output\\migration\\<machine>_<time> with an inventory file. Contains PRIVATE KEYS and clear Wi-Fi passwords."
        description_ru: "Идёт по составу, зовёт паки и собирает всё в output\\migration\\<машина>_<время> вместе с описью. Содержит ЗАКРЫТЫЕ КЛЮЧИ и пароли Wi-Fi открытым текстом."
        service: "system_core.services.devops_tools:migration_kit"
        kind: "dangerous"
        risk_level: "secret_export"
        parameters:
          mode: "export"
      - id: migration_import
        title: "Import the migration"
        title_ru: "Импорт переезда"
        action_group: "Migration export / import"
        action_group_ru: "Переезд: экспорт / импорт"
        action_group_tone: "neutral"
        action_tone: "danger"
        description: "Read the inventory from input, hand every item back to its pack, then check access links. Replaces this user's SSH material and adds Wi-Fi profiles."
        description_ru: "Читает опись из input, отдаёт каждую строку своему паку и заканчивает проверкой доступов. Заменяет SSH-материал этого пользователя и добавляет профили Wi-Fi."
        service: "system_core.services.devops_tools:migration_kit"
        kind: "dangerous"
        risk_level: "system_change"
        parameters:
          mode: "import"
      - id: migration_open_folder
        title: "Open migration folder"
        title_ru: "Открыть папку переезда"
        action_group: "Folders"
        action_group_ru: "Папки"
        action_group_tone: "neutral"
        description: "Open output\\migration; collects nothing."
        description_ru: "Открыть output\\migration; ничего не собирает."
        service: "system_core.services.devops_tools:migration_kit"
        kind: "safe"
        parameters:
          mode: "open_folder"

  - id: utilities
    title: "Utilities"
    title_ru: "Утилиты"
    description: "Small project-local utilities: documentation PDF, the bundled ripgrep and folder shortcuts."
    description_ru: "Мелкие project-local утилиты: PDF документации, встроенный ripgrep и ярлыки папок."
    surface: "os"
    section: "os_workspace"
    children:
      - id: docs_pdf
        title: "Documentation PDF"
        title_ru: "Документация PDF"
        description: "Render project Markdown guides and instructions into docs\\PDF using the Audion Office OCR AI PDF engine."
        description_ru: "Сгенерировать PDF для Markdown-гайдов и инструкций проекта в docs\\PDF через PDF-engine Audion Office OCR AI."
        fields:
          - id: docs_pdf_theme
            type: "select"
            group: "options"
            label: "Theme"
            label_ru: "Тема"
            default: "both"
            options:
              - value: "both"
                label: "Both: dark + light-sand"
                label_ru: "Обе: dark + light-sand"
              - value: "dark"
                label: "Dark"
                label_ru: "Dark"
              - value: "light-sand"
                label: "Light Sand"
                label_ru: "Light Sand"
          - id: docs_pdf_include_agent_instructions
            type: "checkbox"
            section: "advanced"
            label: "Include agent instructions"
            label_ru: "Включить agent instructions"
            default: true
            hint: "Include AGENTS.md and CLAUDE.md together with user guides and docs."
            hint_ru: "Добавить AGENTS.md и CLAUDE.md к пользовательским гайдам и docs."
        children:
          - id: docs_pdf_plan
            title: "Preview PDF export plan"
            title_ru: "Показать план PDF export"
            description: "Dry run: list Markdown sources and target PDF files without writing PDFs."
            description_ru: "Dry run: показать Markdown-источники и целевые PDF без записи файлов."
            service: "system_core.services.devops_tools:docs_pdf_export"
            kind: "safe"
            risk_level: "readonly"
            parameters:
              mode: "plan"
          - id: docs_pdf_render
            title: "Generate docs PDFs"
            title_ru: "Сгенерировать PDF документации"
            description: "Render root guides, docs\\*.md, GitHub README files and optional agent instructions into docs\\PDF. Markdown remains the source of truth."
            description_ru: "Сгенерировать PDF для root guides, docs\\*.md, GitHub README и optional agent instructions в docs\\PDF. Markdown остаётся source of truth."
            service: "system_core.services.devops_tools:docs_pdf_export"
            kind: "safe"
            risk_level: "project_write"
            parameters:
              mode: "render"
          - id: docs_pdf_open
            title: "Open docs PDF folder"
            title_ru: "Открыть папку docs PDF"
            description: "Open docs\\PDF."
            description_ru: "Открыть docs\\PDF."
            service: "system_core.services.devops_tools:docs_pdf_export"
            kind: "safe"
            parameters:
              mode: "open_folder"

      - id: ripgrep_status
        title: "ripgrep version"
        title_ru: "Версия ripgrep"
        description: "Show project-local ripgrep\\rg.exe version."
        description_ru: "Показать версию проектного ripgrep\\rg.exe."
        service: "system_core.services.devops_tools:ripgrep_status"
        kind: "safe"
      - id: open_tool_folder
        title: "Open tool folder"
        title_ru: "Открыть папку утилиты"
        description: "Open a project-local utility folder."
        description_ru: "Открыть project-local utility folder."
        service: "system_core.services.devops_tools:open_tool_folder"
        kind: "safe"
        fields:
          - id: folder
            type: "select"
            label: "Folder"
            label_ru: "Папка"
            searchable: true
            options:
              - value: "ripgrep"
                label: "ripgrep"
              - value: "tools/network_cleaner"
                label: "tools/network_cleaner"
              - value: "WSL"
                label: "WSL"
              - value: "tools/codex_nuke"
                label: "tools/codex_nuke"
              - value: "tools/python_nuke"
                label: "tools/python_nuke"
              - value: "tools/driver_firmware_audit"
                label: "tools/driver_firmware_audit"
              - value: "tools/ssh_keykit"
                label: "tools/ssh_keykit"
              - value: "tools/ubuntu_dev_installer"
                label: "tools/ubuntu_dev_installer"
              - value: "tools/ssd_nvme_reset_wizard"
                label: "tools/ssd_nvme_reset_wizard"
              - value: "tools/winre_extend"
                label: "tools/winre_extend"
              - value: "tools/bitrix_hosts_toggle_pack"
                label: "tools/bitrix_hosts_toggle_pack"
              - value: "tools/disable_windows_proxy"
                label: "tools/disable_windows_proxy"
              - value: "tools/wires_wireless"
                label: "tools/wires_wireless"
              - value: "tools/wsl"
                label: "tools/wsl"


  - id: maintenance
    title: "Maintenance & Cleanup"
    title_ru: "Обслуживание и очистка"
    description: "Software cleanup tools and managed workspace maintenance."
    description_ru: "Утилиты очистки софта и обслуживание managed workspace."
    surface: "os_settings"
    section: "os_maintenance"
    children:
      - id: runtime_codex_nuke
        title: "Codex Nuke"
        title_ru: "Очистка Codex"
        description: "Integrated Codex desktop cleanup tool."
        description_ru: "Встроенный инструмент очистки Codex Desktop."
        children:
          - id: codex_nuke_audit
            title: "Codex Nuke audit"
            title_ru: "Аудит Codex"
            action_group: "Codex cleanup ladder"
            action_group_ru: "Codex: audit / dry-run / reset / nuke"
            action_group_tone: "neutral"
            action_tone: "friendly"
            description: "Read-only scan of Codex desktop artifacts."
            description_ru: "Проверить артефакты Codex Desktop без изменений."
            service: "system_core.services.devops_tools:integrated_nuke_tool"
            kind: "safe"
            risk_level: "readonly"
            parameters:
              tool: "codex"
              mode: "Audit"
          - id: codex_nuke_dryrun
            title: "Codex Nuke dry run"
            title_ru: "Симуляция очистки Codex"
            action_group: "Codex cleanup ladder"
            action_group_ru: "Codex: audit / dry-run / reset / nuke"
            action_group_tone: "neutral"
            action_tone: "friendly"
            description: "Simulate Codex Nuke without changing the system."
            description_ru: "Показать план очистки Codex без изменений системы."
            service: "system_core.services.devops_tools:integrated_nuke_tool"
            kind: "safe"
            risk_level: "readonly"
            parameters:
              tool: "codex"
              mode: "DryRun"
          - id: codex_nuke_session_reset
            title: "Codex session reset"
            title_ru: "Сброс сессии Codex"
            action_group: "Codex cleanup ladder"
            action_group_ru: "Codex: audit / dry-run / reset / nuke"
            action_group_tone: "neutral"
            action_tone: "medium"
            description: "Soft reset: kill Codex processes and clear sessions/cache while keeping auth, config and install."
            description_ru: "Мягкий reset: остановить Codex и очистить sessions/cache, сохранив auth, config и install."
            service: "system_core.services.devops_tools:integrated_nuke_tool"
            kind: "dangerous"
            risk_level: "user_write"
            parameters:
              tool: "codex"
              mode: "SessionReset"
          - id: codex_nuke_keep_cli_state
            title: "Codex NUKE, keep CLI state"
            title_ru: "Полная очистка Codex, сохранить CLI state"
            action_group: "Codex cleanup ladder"
            action_group_ru: "Codex: audit / dry-run / reset / nuke"
            action_group_tone: "neutral"
            action_tone: "danger"
            description: "Remove Codex desktop artifacts while preserving ~/.codex for Codex CLI state."
            description_ru: "Удалить артефакты Codex Desktop, сохранив ~/.codex для Codex CLI state. Сначала используй аудит/dry-run и проверь scope очистки."
            service: "system_core.services.devops_tools:integrated_nuke_tool"
            kind: "dangerous"
            risk_level: "destructive"
            parameters:
              tool: "codex"
              mode: "Nuke"
              KeepCliState: true
          - id: codex_nuke_full
            title: "Codex NUKE full"
            title_ru: "Полная очистка Codex"
            action_group: "Codex cleanup ladder"
            action_group_ru: "Codex: audit / dry-run / reset / nuke"
            action_group_tone: "neutral"
            action_tone: "danger"
            description: "Full Codex desktop removal, including shared Codex user state."
            description_ru: "Полное удаление Codex Desktop, включая общий пользовательский state Codex."
            service: "system_core.services.devops_tools:integrated_nuke_tool"
            kind: "dangerous"
            risk_level: "destructive"
            parameters:
              tool: "codex"
              mode: "Nuke"
      - id: runtime_python_nuke
        title: "Python Nuke"
        title_ru: "Очистка Python"
        description: "Integrated Windows Python cleanup tool."
        description_ru: "Встроенный инструмент очистки Python в Windows."
        children:
          - id: python_nuke_audit
            title: "Python Nuke audit"
            title_ru: "Аудит Python"
            action_group: "Python cleanup ladder"
            action_group_ru: "Python: audit / dry-run / nuke"
            action_group_tone: "neutral"
            action_tone: "friendly"
            description: "Read-only scan of Python installs, launchers, caches, env vars and PATH entries."
            description_ru: "Проверить Python installs, launchers, caches, переменные среды и PATH entries без изменений."
            service: "system_core.services.devops_tools:integrated_nuke_tool"
            kind: "safe"
            risk_level: "readonly"
            parameters:
              tool: "python"
              mode: "Audit"
          - id: python_nuke_dryrun
            title: "Python Nuke dry run"
            title_ru: "Симуляция очистки Python"
            action_group: "Python cleanup ladder"
            action_group_ru: "Python: audit / dry-run / nuke"
            action_group_tone: "neutral"
            action_tone: "friendly"
            description: "Simulate Python Nuke without changing the system."
            description_ru: "Показать план очистки Python без изменений системы."
            service: "system_core.services.devops_tools:integrated_nuke_tool"
            kind: "safe"
            risk_level: "readonly"
            parameters:
              tool: "python"
              mode: "DryRun"
          - id: python_nuke_full
            title: "Python NUKE full"
            title_ru: "Полная очистка Python"
            action_group: "Python cleanup ladder"
            action_group_ru: "Python: audit / dry-run / nuke"
            action_group_tone: "neutral"
            action_tone: "danger"
            description: "Remove common Python installs, launchers, pip cache, env vars and PATH entries."
            description_ru: "Удалить распространённые Python installs, launchers, pip cache, переменные среды и PATH entries. Сначала используй аудит/dry-run и проверь, какие installs попали в scope."
            service: "system_core.services.devops_tools:integrated_nuke_tool"
            kind: "dangerous"
            risk_level: "destructive"
            parameters:
              tool: "python"
              mode: "Nuke"
          - id: python_nuke_keep_winget
            title: "Python NUKE, keep winget"
            title_ru: "Очистка Python без winget uninstall"
            action_group: "Python cleanup ladder"
            action_group_ru: "Python: audit / dry-run / nuke"
            action_group_tone: "neutral"
            action_tone: "danger"
            description: "Run Python Nuke but skip the winget uninstall pass."
            description_ru: "Запустить очистку Python, но пропустить winget uninstall pass. Всё равно чистит launchers/cache/env/PATH в выбранном scope; сначала используй аудит/dry-run."
            service: "system_core.services.devops_tools:integrated_nuke_tool"
            kind: "dangerous"
            risk_level: "destructive"
            parameters:
              tool: "python"
              mode: "Nuke"
              KeepWinget: true

      - id: cleanup_workspace
        title: "Clear Workbench workspace"
        title_ru: "Очистить workspace"
        description: "Delete only files inside the managed workspace folder."
        description_ru: "Удалить только файлы внутри управляемой папки workspace."
        service: "system_core.services.sample_service:cleanup_workspace"
        kind: "dangerous"
        risk_level: "destructive"

maintenance_operations:
  - id: cleanup_input_output
    title: "Clear Workbench I/O"
    title_ru: "Очистить I/O"
    description: "Delete contents of managed input and output folders."
    description_ru: "Удалить содержимое управляемых папок input и output."
    service: "system_core.services.sample_service:cleanup_input_output"
    kind: "dangerous"
    risk_level: "destructive"
