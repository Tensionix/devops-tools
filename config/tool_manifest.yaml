        action_tone: "friendly"
        description: "Bitwise depatch: restore the exact pre-patch hosts backup referenced by the managed hosts line."
        description_ru: "Побитовый depatch: восстановить точный pre-patch backup hosts, указанный в managed hosts line."
        service: "system_core.services.devops_tools:bitrix_hosts"
        kind: "dangerous"
