  - id: wsl
    title: "WSL Toolkit"
    title_ru: "WSL Toolkit"
    description: "One WSL module: install, import, backup, clone, move, restore and delete distributions."
    description_ru: "Единый WSL-модуль: install/import/backup/clone/move/restore/delete дистрибутивов."
    surface: "os"
    section: "os_platforms"
    children:
      - id: wsl_basic
        title: "Basic and install"
        title_ru: "Базовые и установка"
        action_group: "Install / platform"
        action_group_ru: "Install / platform"
        action_group_tone: "neutral"
        description: "Enable/update WSL2, list online distros, install from catalog or local image, list/status/shutdown."
        description_ru: "Включить/обновить WSL2, показать online-дистрибутивы, установить из каталога или локального образа, выполнить list/status/shutdown."
        children:
          - id: wsl_system_status
            title: "System WSL2 status"
            title_ru: "Статус WSL2 в системе"
            action_group: "Inspect / catalogs"
            action_group_ru: "Проверка / каталоги"
            action_group_tone: "neutral"
            description: "Show Windows optional features, WSL status and installed distributions."
            description_ru: "Показать компоненты Windows, WSL status и установленные дистрибутивы."
            service: "system_core.services.devops_tools:wsl_system_status"
            kind: "safe"
          - id: wsl_enable_features
            title: "Enable WSL2 features"
            title_ru: "Установить WSL2 в Windows"
            action_group: "WSL engine"
            action_group_ru: "WSL engine: включить / обновить"
            action_group_tone: "neutral"
            description: "Enable Microsoft-Windows-Subsystem-Linux and VirtualMachinePlatform, then set WSL default version to 2. Reboot may be required."
            description_ru: "Включить компоненты Microsoft-Windows-Subsystem-Linux и VirtualMachinePlatform, затем поставить WSL default version 2. Может потребоваться перезагрузка."
            service: "system_core.services.devops_tools:wsl_enable_features"
            kind: "dangerous"
            risk_level: "system_change"
          - id: wsl_update_engine
            title: "Update WSL2"
            title_ru: "Обновить WSL2"
            action_group: "WSL engine"
            action_group_ru: "WSL engine: включить / обновить"
            action_group_tone: "neutral"
            description: "Run wsl --update for the Windows WSL engine."
            description_ru: "Выполнить wsl --update для Windows WSL engine."
            service: "system_core.services.devops_tools:wsl_update"
            kind: "dangerous"
            risk_level: "system_change"
          - id: wsl_list_online
            title: "Installable distros"
            title_ru: "Список для установки"
            action_group: "Inspect / catalogs"
            action_group_ru: "Проверка / каталоги"
            action_group_tone: "neutral"
            description: "Run wsl --list --online and print available distro names."
            description_ru: "Выполнить wsl --list --online и вывести доступные имена дистрибутивов."
            service: "system_core.services.devops_tools:wsl_list_online"
            kind: "safe"
          - id: wsl_install_distro
            title: "Install distro"
            title_ru: "Установить дистрибутив"
            action_group: "Install / import"
            action_group_ru: "Install / import"
            action_group_tone: "neutral"
            description: "Install the selected online WSL distro either into the system default location or into a selected folder."
            description_ru: "Установить выбранный online WSL-дистрибутив в системное место или в выбранную папку."
            service: "system_core.services.devops_tools:wsl_install_distro"
            kind: "dangerous"
            risk_level: "system_change"
            fields:
              - id: install_distro_pins
                type: "profile_buttons"
                label: "Pinned distros"
                label_ru: "Пины дистрибутивов"
                presets:
                  - id: ubuntu_2604
                    label: "Ubuntu 26.04"
                    label_ru: "Ubuntu 26.04"
                    values:
                      install_distro: "Ubuntu-26.04"
                  - id: ubuntu_2404
                    label: "Ubuntu 24.04"
                    label_ru: "Ubuntu 24.04"
                    values:
                      install_distro: "Ubuntu-24.04"
                  - id: ubuntu_2204
                    label: "Ubuntu 22.04"
                    label_ru: "Ubuntu 22.04"
                    values:
                      install_distro: "Ubuntu-22.04"
                  - id: fedora_44
                    label: "Fedora 44"
                    label_ru: "Fedora 44"
                    values:
                      install_distro: "FedoraLinux-44"
                  - id: opensuse_leap_160
                    label: "openSUSE 16.0"
                    label_ru: "openSUSE 16.0"
                    values:
                      install_distro: "openSUSE-Leap-16.0"
              - id: install_distro
                type: "select"
                label: "Distro"
                label_ru: "Дистрибутив"
                default: "Ubuntu-26.04"
                options_source: "system_core.services.devops_tools:wsl_online_distro_options"
                cache_seconds: 120
                searchable: true
                refresh_label: "Refresh WSL catalog"
                refresh_label_ru: "Обновить каталог WSL"
                hint: "Uses the full Windows WSL online catalog. Ubuntu 26.04 is the default pinned choice."
                hint_ru: "Берёт полный штатный online-каталог Windows WSL. По умолчанию закреплён Ubuntu 26.04."
              - id: install_distro_override
                type: "text"
                label: "Manual distro"
                label_ru: "Дистрибутив вручную"
                placeholder: "Ubuntu"
                advanced: true
                hint: "Overrides the dropdown value when filled."
                hint_ru: "Если заполнено, заменяет выбор из списка."
              - id: install_name
                type: "text"
                label: "Instance name"
                label_ru: "Имя инстанса"
                placeholder: "Fedora-Test"
                advanced: true
                hint: "Optional WSL instance name; leave empty to use the distro name."
                hint_ru: "Опциональное имя WSL-инстанса; пусто = имя дистрибутива."
              - id: install_location_mode
                type: "radio"
                label: "Install location"
                label_ru: "Место установки"
                default: "custom"
                options:
                  - value: "custom"
                    label: "Selected folder"
                    label_ru: "Выбранная папка"
                  - value: "system"
                    label: "System default"
                    label_ru: "Системное место"
              - id: install_location
                type: "folder"
                label: "Install folder"
                label_ru: "Папка установки"
                placeholder: "Default: bundle WSL\\VHDX\\<distro>"
                hint: "Destination folder for the new WSL instance, not a source folder."
                hint_ru: "Куда установить новый WSL-дистрибутив; это не папка-источник."
              - id: no_launch
                type: "checkbox"
                label: "Do not launch after install"
                label_ru: "Не запускать после установки"
                default: true
          - id: wsl_install_from_file
            title: "Install from image file"
            title_ru: "Установить из файла образа"
            action_group: "Install / import"
            action_group_ru: "Install / import"
            action_group_tone: "neutral"
            description: "Install a local .wsl image such as ubuntu-26.04-wsl-amd64.wsl, or import tar/vhd/vhdx into a selected folder."
            description_ru: "Установить локальный .wsl образ, например ubuntu-26.04-wsl-amd64.wsl, или импортировать tar/vhd/vhdx в выбранную папку."
            service: "system_core.services.devops_tools:wsl_install_from_file"
            kind: "dangerous"
            risk_level: "system_change"
            fields:
              - id: install_image_file
                type: "file"
                label: "WSL source image"
                label_ru: "Файл образа WSL"
                placeholder: "ubuntu-26.04-wsl-amd64.wsl"
              - id: install_name
                type: "text"
                label: "Distro name"
                label_ru: "Имя дистрибутива"
                placeholder: "Ubuntu-26.04"
              - id: install_location
                type: "folder"
                label: "Install folder"
                label_ru: "Папка установки"
                placeholder: "Default: bundle WSL\\VHDX\\<name>"
                hint: "Destination folder for the new WSL instance, not a source folder."
                hint_ru: "Куда установить новый WSL-дистрибутив; это не папка-источник."
              - id: no_launch
                type: "checkbox"
                label: "Do not launch after install"
                label_ru: "Не запускать после установки"
                default: true
          - id: wsl_list
            title: "Installed distros"
            title_ru: "Список установленных"
            action_group: "Inspect / catalogs"
            action_group_ru: "Проверка / каталоги"
            action_group_tone: "neutral"
            description: "Run wsl --list --verbose."
            description_ru: "Выполнить wsl --list --verbose."
            service: "system_core.services.devops_tools:wsl_toolkit"
            kind: "safe"
            parameters:
              action: "list"
          - id: wsl_status
            title: "WSL status"
            title_ru: "Статус WSL"
            action_group: "Inspect / catalogs"
            action_group_ru: "Проверка / каталоги"
            action_group_tone: "neutral"
            description: "Run wsl --status."
