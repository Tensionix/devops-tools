              - id: driver_store_restore
                title: "Restore exported drivers"
                title_ru: "Восстановить экспортированные драйверы"
                action_group: "Driver Store backup / export / restore"
                action_group_ru: "Driver Store: backup / export / restore"
                action_group_tone: "neutral"
                action_tone: "danger"
                description: "Runs pnputil /add-driver on the selected backup without interactive prompts. Use backups from the same machine or a very similar hardware profile."
                description_ru: "Запускает pnputil /add-driver по выбранному backup без интерактивных prompts. Используй backups с той же машины или очень близкого железа."
                service: "system_core.services.devops_tools:driver_update_blocker"
                kind: "dangerous"
                risk_level: "system_change"
                parameters:
                  mode: "restore_drivers"
              - id: driver_store_open_backups
                title: "Open driver backups"
                title_ru: "Открыть driver backups"
                action_group: "Driver Store folders"
                action_group_ru: "Driver Store folders"
                action_group_tone: "neutral"
                description: "Open the exported driver backup folder."
                description_ru: "Открыть папку экспортированных driver backups."
                service: "system_core.services.devops_tools:driver_update_blocker"
                kind: "safe"
                parameters:
                  mode: "open_driver_backups"

          - id: driver_update_open_tool
            title: "Open Driver Update Blocker folder"
            title_ru: "Открыть папку Driver Update Blocker"
            action_group: "Folders"
            action_group_ru: "Папки"
            action_group_tone: "neutral"
            description: "Open the project-local PowerShell module folder used by the GUI and project launchers."
            description_ru: "Открыть проектную PowerShell-папку модуля, которую используют GUI и project launchers."
            service: "system_core.services.devops_tools:driver_update_blocker"
            kind: "safe"
            parameters:
              mode: "open_tool_folder"

