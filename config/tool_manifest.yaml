            label_ru: "Удалить и закреплённый файл"
            default: false
            hint: "Used by Turn the protection off; the file is backed up first."
            hint_ru: |
              Относится только к «Снять закрепление»: заодно убирает файл из системной папки.
              Перед удалением он сохраняется в резервной копии.
          - id: allow_unsupported_policy_edition
